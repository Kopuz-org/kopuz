await-holding-invalid-types = [
  "generational_box::GenerationalRef",
  { path = "generational_box::GenerationalRef", reason = "Reads should not be held over an await point. This will cause any writes to fail while the await is pending since the read borrow is still active." },
  "generational_box::GenerationalRefMut",
  { path = "generational_box::GenerationalRefMut", reason = "Write should not be held over an await point. This will cause any reads or writes to fail while the await is pending since the write borrow is still active." },
  "dioxus_signals::WriteLock",
  { path = "dioxus_signals::WriteLock", reason = "Write should not be held over an await point. This will cause any reads or writes to fail while the await is pending since the write borrow is still active." },
]

# Dioxus render helpers naturally take many props (title/eyebrow/data + several
# event handlers + a scroll callback); 8 is a reasonable ceiling for this UI crate.
too-many-arguments-threshold = 8

# reqwest switches every client to native-tls once any crate compiles it in, so clients name their backend in utils::http.
disallowed-methods = [
  { path = "reqwest::Client::new", reason = "build HTTP clients through utils::http" },
  { path = "reqwest::Client::builder", reason = "build HTTP clients through utils::http" },
  { path = "reqwest::ClientBuilder::new", reason = "build HTTP clients through utils::http" },
  { path = "reqwest::get", reason = "build HTTP clients through utils::http" },
  { path = "reqwest::blocking::Client::new", reason = "build HTTP clients through utils::http" },
  { path = "reqwest::blocking::Client::builder", reason = "build HTTP clients through utils::http" },
  { path = "reqwest::blocking::ClientBuilder::new", reason = "build HTTP clients through utils::http" },
  { path = "reqwest::blocking::get", reason = "build HTTP clients through utils::http" },
]
