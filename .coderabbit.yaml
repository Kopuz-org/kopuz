# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - CONTRIBUTING.md

reviews:
  pre_merge_checks:
    custom_checks:
      - name: Template headings
        mode: warning
        instructions: |
          Pass if the PR description's Markdown headings are exactly, in this order:
          "## Why", "## What Changed", "## Checklist", "## Testing", "## Before / After",
          "## AI Usage". Fail if any of these is missing, renamed or reordered, or if the
          description has any other heading at any level. Ignore headings inside HTML
          comments.

      - name: Testing matrix
        mode: warning
        instructions: |
          Look at the table under "## Testing". Its columns are Behavior, Linux, macOS,
          Windows and Android. Pass if every row has a non-empty Behavior cell and at
          least one platform column has ✅ in every row. Fail if the table is missing,
          a Behavior cell is empty, or no platform column is all ✅.

      - name: Before / After
        mode: warning
        instructions: |
          Look at the "## Before / After" section. Pass if it says "No visible or
          audible change" and the diff does not change UI or playback: no changes under
          crates/components, crates/pages, crates/kopuz/assets or crates/player, and no
          change to rendered markup or styles elsewhere. Otherwise pass only if the table
          has at least one row whose Change cell is filled and whose Before and After
          cells each contain an image, a video or a link to an uploaded attachment. Fail
          in every other case.

      - name: One behavior change
        mode: warning
        instructions: |
          Read "## Why", "## What Changed" and the diff. Pass if the PR changes a single
          behavior: one fix or one feature, however many crates it touches. Fail if it
          bundles unrelated fixes, features or cleanups that could be separate pull
          requests, and name each one.

      - name: No AI attribution
        mode: warning
        instructions: |
          Fail if the PR description contains a "Generated with" or "Generated by" footer
          naming an AI tool (for example "🤖 Generated with Claude Code"), or a
          Co-authored-by line naming an AI tool. Otherwise pass. The "## AI Usage"
          checkbox is the allowed disclosure and does not count.
