name: commit message

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [master]

jobs:
  commit-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          zero=0000000000000000000000000000000000000000
          if [[ "$BASE_SHA" == "$zero" ]]; then
            range="$HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi

          checked=0
          failed=0
          # First parent only: a subtree merge brings in another repo's history, written under its own rules.
          while IFS=$'\t' read -r sha subject; do
            checked=$((checked + 1))
            scripts/check_subject.sh "$sha" "$subject" || failed=1
          done < <(git log --first-parent --format='%h%x09%s' "$range")

          if ((checked == 0)); then
            echo "No commits to check."
          elif ((failed)); then
            exit 1
          else
            echo "Checked $checked commit subject(s)."
          fi

      # A squash merge lands the title, with " (#N)" appended, as the commit subject.
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/check_subject.sh "PR title" "$TITLE (#$NUMBER)"

      # Push events would rescan history that predates the rule, so this only gates new PR commits.
      - name: Check for AI attribution
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          tools='claude|anthropic|copilot|cursor|codex|openai|chatgpt|gemini|devin|aider|windsurf|codeium'
          ai_re="^co-authored-by:.*($tools)|generated (with|by) .*($tools)"
          failed=0
          while read -r sha; do
            if hits=$(git log -1 --format=%B "$sha" | grep -iE "$ai_re"); then
              while IFS= read -r line; do
                echo "::error title=AI attribution::${sha:0:9}: $line"
              done <<<"$hits"
              failed=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")

          exit "$failed"
