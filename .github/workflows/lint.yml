name: lint

on:
  # A branch with a pull request is linted by pull_request already, so push covers master alone.
  push:
    branches: [main, master]
    paths:
      - 'README.md'
      - '.github/workflows/lint.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/**'
      - 'shared/**'
      - 'daemon/**'
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/lint.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/**'
      - 'shared/**'
      - 'daemon/**'

# A new push to a pull request makes its running checks moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deno-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check README.md formatting
        run: deno fmt --check README.md

  rust-lint:
    env:
      SQLX_OFFLINE: true
    runs-on: ubuntu-22.04
    # Three builds that share nothing, so they run side by side instead of one after another.
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: clippy
            run: cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings
          - check: clippy-release
            run: cargo clippy --workspace --all-targets --release -- -D warnings
          - check: test
            run: cargo test --workspace --locked
    name: rust-lint (${{ matrix.check }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libopus-dev libasound2-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libssl-dev \
            libglib2.0-dev libpango1.0-dev \
            libcairo2-dev libgdk-pixbuf-2.0-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-xcb-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Matrix jobs share a job id, so each needs its own key or they overwrite one cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.check }}

      # Linking the test binaries is most of what mold speeds up.
      - uses: rui314/setup-mold@v1
        if: matrix.check == 'test'

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.run }}
