name: lint

on:
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - '.github/workflows/lint.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/lint.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'

jobs:
  deno-fmt:
    runs-on: [self-hosted, linux, x64, morph, small]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Check README.md formatting
        run: nix shell nixpkgs#deno --command deno fmt --check README.md

  rust-lint:
    runs-on: [self-hosted, linux, x64, morph, large]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libopus-dev libasound2-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libssl-dev \
            libglib2.0-dev libpango1.0-dev \
            libcairo2-dev libgdk-pixbuf-2.0-dev

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
