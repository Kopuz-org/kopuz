name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Kopuz ships as Kopuz_<ver>_*, Kopuz Legacy as Kopuz-Legacy-<ver>-*, a v<ver>-nightly.YYYYMMDD tag as the Kopuz-Nightly_<ver>_* pre-release.

jobs:
  linux-legacy:
    # Kopuz Nightly is the GPUI app alone; Legacy and Android ship only with releases.
    if: ${{ !(github.ref_type == 'tag' && contains(github.ref_name, '-nightly.')) }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libopus-dev libasound2-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libssl-dev \
            libglib2.0-dev libpango1.0-dev \
            libcairo2-dev libgdk-pixbuf-2.0-dev \
            fakeroot libfuse2 rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dioxus-cli
        run: cargo install dioxus-cli@0.7.9 --locked

      - name: Install Node dependencies
        run: npm ci

      - name: Build CSS
        run: npx @tailwindcss/cli -i ./tailwind.css -o ./apps/legacy/kopuz/assets/tailwind.css --content './apps/legacy/kopuz/**/*.rs,./apps/legacy/components/**/*.rs,./apps/legacy/pages/**/*.rs,./apps/legacy/hooks/**/*.rs,./daemon/player/**/*.rs,./daemon/reader/**/*.rs'

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "kopuz-legacy") | .version'
          )"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Linux application
        run: dx build --release --platform desktop --package kopuz-legacy --locked

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/dx/kopuz-legacy/release/linux/app/kopuz-legacy AppDir/usr/bin/kopuz-legacy
          cp data/moe.kopuz.legacy.desktop AppDir/usr/share/applications/
          cp apps/legacy/kopuz/assets/logo.png AppDir/usr/share/icons/hicolor/256x256/apps/moe.kopuz.legacy.png

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

      - name: Build AppImage
        env:
          ARCH: x86_64
          GTK_THEME: Adwaita
          DEPLOY_GTK_VERSION: "3"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --exclude-library "libwebkit2gtk*" \
            --exclude-library "libjavascriptcoregtk*" \
            --output appimage

      - name: Collect AppImage
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          appimage="$(
            find . -maxdepth 1 -type f -iname '*.AppImage' \
              ! -name 'linuxdeploy*.AppImage' -print -quit
          )"

          if [[ -z "$appimage" ]]; then
            echo "linuxdeploy did not produce an AppImage"
            exit 1
          fi

          mkdir -p dist
          mv "$appimage" "dist/Kopuz-Legacy-${VERSION}-x86_64.AppImage"

      - name: Build DEB and RPM packages
        run: |
          dx bundle --release --platform desktop --package kopuz-legacy --package-types deb --out-dir bundle-deb --locked
          dx bundle --release --platform desktop --package kopuz-legacy --package-types rpm --out-dir bundle-rpm --locked
          mv bundle-deb/*.deb dist/
          mv bundle-rpm/*.rpm dist/

      - name: Create Linux checksums
        shell: bash
        run: |
          set -euo pipefail

          for package in dist/*.AppImage dist/*.deb dist/*.rpm; do
            (cd dist && sha256sum "${package#dist/}" > "${package#dist/}.sha256")
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: kopuz-release-linux-legacy-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libopus-dev libasound2-dev libssl-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype-dev \
            libfuse2 rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install cargo-packager and nfpm
        run: |
          cargo install cargo-packager@0.11.8 --locked
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "kopuz") | .version'
          )"
          base="$version"

          nightly=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" =~ ^${base//./\\.}-nightly\.[0-9]{8}(\.[0-9]+)?$ ]]; then
              nightly=true
              version="$tag"
            elif [[ "$tag" != "$base" ]]; then
              echo "Tag ${GITHUB_REF_NAME} is neither v${base} nor a v${base}-nightly.YYYYMMDD"
              exit 1
            fi
          fi

          # A nightly carries its tag's version in this build only; nothing is committed.
          if [[ "$nightly" == true ]]; then
            sed -i "s/\"${base}\"/\"${version}\"/g" Cargo.toml
            cargo update -w
          fi

          {
            echo "version=${version}"
            echo "nightly=${nightly}"
            if [[ "$nightly" == true ]]; then
              echo "flavor=nightly"
              echo "package=kopuz-nightly"
              echo "suffix=-nightly"
              echo "asset=Kopuz-Nightly"
            else
              echo "flavor=stable"
              echo "package=kopuz"
              echo "suffix="
              echo "asset=Kopuz"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build the app, daemon and command-line client
        env:
          KOPUZ_FLAVOR: ${{ steps.version.outputs.flavor }}
        run: cargo build --release --locked -p kopuz -p kopuz-kopuzd -p kopuz-ctl

      - name: Name the binaries for Kopuz Nightly
        if: steps.version.outputs.nightly == 'true'
        run: |
          for binary in kopuz kopuzd kopuzctl; do
            cp "target/release/${binary}" "target/release/${binary}-nightly"
          done

      - name: Build DEB and RPM packages
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          set -euo pipefail

          mkdir -p dist
          nfpm package -f "packaging/${PACKAGE}/nfpm.yaml" -p deb -t dist/
          nfpm package -f "packaging/${PACKAGE}/nfpm.yaml" -p rpm -t dist/
          # nfpm spells a pre-release its own way per format; the AUR package and the docs expect these names.
          if [[ "$PACKAGE" == kopuz-nightly ]]; then
            mv dist/kopuz-nightly*.deb "dist/kopuz-nightly_${VERSION}_amd64.deb"
            mv dist/kopuz-nightly*.rpm "dist/kopuz-nightly-${VERSION}.x86_64.rpm"
          fi

      - name: Build AppImage
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NIGHTLY: ${{ steps.version.outputs.nightly }}
          ASSET: ${{ steps.version.outputs.asset }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail

          if [[ "$NIGHTLY" == true ]]; then
            config=packaging/kopuz-nightly/kopuz-nightly.ci.toml
            sed "s/@VERSION@/${VERSION}/" packaging/kopuz-nightly/kopuz-nightly.toml > "$config"
            cargo packager --config "$config" --release -f appimage --out-dir "$PWD/bundle-appimage"
          else
            cargo packager -p kopuz --release -f appimage --out-dir "$PWD/bundle-appimage"
          fi
          shopt -s nullglob
          appimages=(bundle-appimage/*.AppImage)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}"
            exit 1
          fi
          mv "${appimages[0]}" "dist/${ASSET}_${VERSION}_x86_64.AppImage"

      - name: Check every package carries the daemon
        shell: bash
        env:
          DAEMON: /usr/bin/kopuzd${{ steps.version.outputs.suffix }}
        run: |
          set -euo pipefail

          for deb in dist/*.deb; do
            grep -q "\.${DAEMON}\$" <<<"$(dpkg-deb -c "$deb")"
          done
          for rpm in dist/*.rpm; do
            grep -qx "$DAEMON" <<<"$(rpm -qlp "$rpm")"
          done

      - name: Create Linux checksums
        shell: bash
        run: |
          set -euo pipefail

          for package in dist/*.AppImage dist/*.deb dist/*.rpm; do
            (cd dist && sha256sum "${package#dist/}" > "${package#dist/}.sha256")
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          # A nightly's artifacts keep their own prefix, so its release never takes in another job's packages.
          name: ${{ steps.version.outputs.nightly == 'true' && 'kopuz-nightly-linux' || format('kopuz-release-linux-{0}', steps.version.outputs.version) }}
          path: dist/*
          if-no-files-found: error

  macos-legacy:
    if: ${{ !(github.ref_type == 'tag' && contains(github.ref_name, '-nightly.')) }}
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.9 -y --force --disable-strategies compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node dependencies
        run: npm ci

      - name: Build CSS
        run: npx @tailwindcss/cli -i ./tailwind.css -o ./apps/legacy/kopuz/assets/tailwind.css --content './apps/legacy/kopuz/**/*.rs,./apps/legacy/components/**/*.rs,./apps/legacy/pages/**/*.rs,./apps/legacy/hooks/**/*.rs,./daemon/player/**/*.rs,./daemon/reader/**/*.rs'

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "kopuz-legacy") | .version'
          )"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Bundle macOS application
        run: dx bundle --release --platform desktop --package kopuz-legacy --package-types macos --out-dir dist --locked

      - name: Set bundle version and apply ad-hoc signature
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" dist/KopuzLegacy.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" dist/KopuzLegacy.app/Contents/Info.plist
          codesign --force --sign - dist/KopuzLegacy.app/Contents/MacOS/kopuz-legacy
          codesign --force --deep --sign - dist/KopuzLegacy.app
          codesign --verify --deep --strict --verbose=2 dist/KopuzLegacy.app

      - name: Free disk space for DMG
        run: |
          cargo clean
          rm -rf node_modules
          df -h /

      - name: Create DMG and checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          dmg="dist/Kopuz-Legacy-${VERSION}-aarch64.dmg"
          hdiutil create -volname "Kopuz Legacy" -srcfolder dist/KopuzLegacy.app -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" > "${dmg}.sha256"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: kopuz-release-macos-legacy-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.8 --locked

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "kopuz") | .version'
          )"
          base="$version"

          nightly=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" =~ ^${base//./\\.}-nightly\.[0-9]{8}(\.[0-9]+)?$ ]]; then
              nightly=true
              version="$tag"
            elif [[ "$tag" != "$base" ]]; then
              echo "Tag ${GITHUB_REF_NAME} is neither v${base} nor a v${base}-nightly.YYYYMMDD"
              exit 1
            fi
          fi

          # A nightly carries its tag's version in this build only; nothing is committed.
          if [[ "$nightly" == true ]]; then
            sed "s/\"${base}\"/\"${version}\"/g" Cargo.toml > Cargo.toml.next
            mv Cargo.toml.next Cargo.toml
            cargo update -w
          fi

          {
            echo "version=${version}"
            echo "nightly=${nightly}"
            if [[ "$nightly" == true ]]; then
              echo "flavor=nightly"
              echo "asset=Kopuz-Nightly"
              echo "product=Kopuz Nightly"
              echo "suffix=-nightly"
            else
              echo "flavor=stable"
              echo "asset=Kopuz"
              echo "product=Kopuz"
              echo "suffix="
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Build the app, daemon and command-line client
        env:
          KOPUZ_FLAVOR: ${{ steps.version.outputs.flavor }}
        run: cargo build --release --locked -p kopuz -p kopuz-kopuzd -p kopuz-ctl

      - name: Name the binaries for Kopuz Nightly
        if: steps.version.outputs.nightly == 'true'
        run: |
          for binary in kopuz kopuzd kopuzctl; do
            cp "target/release/${binary}" "target/release/${binary}-nightly"
          done

      - name: Bundle macOS application
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NIGHTLY: ${{ steps.version.outputs.nightly }}
        run: |
          set -euo pipefail

          if [[ "$NIGHTLY" == true ]]; then
            config=packaging/kopuz-nightly/kopuz-nightly.ci.toml
            sed "s/@VERSION@/${VERSION}/" packaging/kopuz-nightly/kopuz-nightly.toml > "$config"
            cargo packager --config "$config" --release -f app --out-dir "$PWD/dist"
          else
            cargo packager -p kopuz --release -f app --out-dir "$PWD/dist"
          fi

      # Inside-out: the helpers first, then the bundle that seals them, never --deep.
      - name: Apply ad-hoc signature
        shell: bash
        env:
          PRODUCT: ${{ steps.version.outputs.product }}
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: |
          app="dist/${PRODUCT}.app"
          test -x "$app/Contents/MacOS/kopuzd${SUFFIX}"
          for binary in kopuzd kopuzctl kopuz; do
            codesign --force --sign - "$app/Contents/MacOS/${binary}${SUFFIX}"
          done
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Free disk space for DMG
        run: |
          cargo clean
          df -h /

      - name: Create DMG and checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRODUCT: ${{ steps.version.outputs.product }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          set -euo pipefail

          dmg="dist/${ASSET}_${VERSION}_aarch64.dmg"
          hdiutil create -volname "$PRODUCT" -srcfolder "dist/${PRODUCT}.app" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" > "${dmg}.sha256"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          # A nightly's artifacts keep their own prefix, so its release never takes in another job's packages.
          name: ${{ steps.version.outputs.nightly == 'true' && 'kopuz-nightly-macos' || format('kopuz-release-macos-{0}', steps.version.outputs.version) }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  windows-legacy:
    # Kopuz Nightly is the GPUI app alone; Legacy and Android ship only with releases.
    if: ${{ !(github.ref_type == 'tag' && contains(github.ref_name, '-nightly.')) }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        # A new key rebuilds v8, whose build script does not rerun when CARGO_FEATURE_CRT_STATIC changes.
        with:
          key: crt-static

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.9 -y --force --disable-strategies compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Cargo bin to PATH
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
          $cargoBin = Join-Path $cargoHome "bin"
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Node dependencies
        run: npm ci

      - name: Build CSS
        run: npx @tailwindcss/cli -i ./tailwind.css -o ./apps/legacy/kopuz/assets/tailwind.css --content './apps/legacy/kopuz/**/*.rs,./apps/legacy/components/**/*.rs,./apps/legacy/pages/**/*.rs,./apps/legacy/hooks/**/*.rs,./daemon/player/**/*.rs,./daemon/reader/**/*.rs'

      - name: Read and verify version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "kopuz-legacy").version

          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $version"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build EXE and MSI installers
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dx bundle --release --platform desktop --package kopuz-legacy --package-types nsis --out-dir bundle-nsis --locked
          dx bundle --release --platform desktop --package kopuz-legacy --package-types msi --out-dir bundle-msi --locked

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $exe = @(Get-ChildItem bundle-nsis -Filter *.exe)
          $msi = @(Get-ChildItem bundle-msi -Filter *.msi)
          if ($exe.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected one EXE and one MSI installer, found $($exe.Count) and $($msi.Count)"
          }
          Move-Item $exe[0].FullName "dist/Kopuz-Legacy-$env:VERSION-x64-setup.exe"
          Move-Item $msi[0].FullName "dist/Kopuz-Legacy-$env:VERSION-x64.msi"

      - name: Create Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".msi" } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: kopuz-release-windows-legacy-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.exe.sha256
            dist/*.msi
            dist/*.msi.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        # A new key rebuilds v8, whose build script does not rerun when CARGO_FEATURE_CRT_STATIC changes.
        with:
          key: crt-static

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.8 --locked

      - name: Read and verify version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $base = ($metadata.packages | Where-Object name -eq "kopuz").version
          $version = $base
          $nightly = $false

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -match ('^' + [regex]::Escape($base) + '-nightly\.[0-9]{8}(\.[0-9]+)?$')) {
              $nightly = $true
              $version = $tag
            } elseif ($tag -ne $base) {
              throw "Tag $env:GITHUB_REF_NAME is neither v$base nor a v$base-nightly.YYYYMMDD"
            }
          }

          # A nightly carries its tag's version in this build only; nothing is committed.
          if ($nightly) {
            (Get-Content Cargo.toml -Raw).Replace("`"$base`"", "`"$version`"") | Set-Content Cargo.toml -NoNewline
            cargo update -w
            if ($LASTEXITCODE -ne 0) { throw "cargo update failed" }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "nightly=$($nightly.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "flavor=$(if ($nightly) { 'nightly' } else { 'stable' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset=$(if ($nightly) { 'Kopuz-Nightly' } else { 'Kopuz' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build the app, daemon and command-line client
        env:
          KOPUZ_FLAVOR: ${{ steps.version.outputs.flavor }}
        run: cargo build --release --locked -p kopuz -p kopuz-kopuzd -p kopuz-ctl

      - name: Name the binaries for Kopuz Nightly
        if: steps.version.outputs.nightly == 'true'
        shell: pwsh
        run: |
          foreach ($binary in 'kopuz', 'kopuzd', 'kopuzctl') {
            Copy-Item "target/release/$binary.exe" "target/release/$binary-nightly.exe"
          }

      - name: Build installers
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NIGHTLY: ${{ steps.version.outputs.nightly }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          # WiX takes only numeric versions, so a nightly ships the NSIS installer alone.
          if ($env:NIGHTLY -eq 'true') {
            $config = 'packaging/kopuz-nightly/kopuz-nightly.ci.toml'
            (Get-Content packaging/kopuz-nightly/kopuz-nightly.toml -Raw).Replace('@VERSION@', $env:VERSION) | Set-Content $config -NoNewline
            cargo packager --config $config --release -f nsis --out-dir "$PWD\bundle"
          } else {
            cargo packager -p kopuz --release -f nsis,wix --out-dir "$PWD\bundle"
          }
          if ($LASTEXITCODE -ne 0) { throw "cargo packager failed" }

          $exe = @(Get-ChildItem bundle -Filter *-setup.exe)
          if ($exe.Count -ne 1) {
            throw "Expected one EXE installer, found $($exe.Count)"
          }
          Move-Item $exe[0].FullName "dist/$($env:ASSET)_$($env:VERSION)_x64-setup.exe"

          if ($env:NIGHTLY -ne 'true') {
            $msi = @(Get-ChildItem bundle -Filter *.msi)
            if ($msi.Count -ne 1) {
              throw "Expected one MSI installer, found $($msi.Count)"
            }
            Move-Item $msi[0].FullName "dist/$($env:ASSET)_$($env:VERSION)_x64.msi"
          }

      - name: Create Windows checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".msi" } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.nightly == 'true' && 'kopuz-nightly-windows' || format('kopuz-release-windows-{0}', steps.version.outputs.version) }}
          path: |
            dist/*.exe
            dist/*.exe.sha256
            dist/*.msi
            dist/*.msi.sha256
          if-no-files-found: error

  android:
    # Kopuz Nightly is the GPUI app alone; Legacy and Android ship only with releases.
    if: ${{ !(github.ref_type == 'tag' && contains(github.ref_name, '-nightly.')) }}
    # 24.04, not 22.04: the binstall'd dx is built against glibc 2.39, and an
    # APK has no host-glibc compatibility concerns (unlike the Linux job).
    runs-on: ubuntu-24.04

    # The signing secrets are scoped to the three steps that need them (guard,
    # decode, APK build) instead of the whole job, so the toolchain-install and
    # npm steps never see them. The `secrets` context is not available in step
    # `if` expressions, so the decode gate reads this job-level boolean, which
    # carries no secret material.
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1

      - name: Install dioxus-cli
        run: cargo binstall dioxus-cli@0.7.9 -y --force --disable-strategies compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node dependencies
        run: npm ci

      - name: Build CSS
        run: npx @tailwindcss/cli -i ./tailwind.css -o ./apps/legacy/kopuz/assets/tailwind.css --content './apps/legacy/kopuz/**/*.rs,./apps/legacy/components/**/*.rs,./apps/legacy/pages/**/*.rs,./apps/legacy/hooks/**/*.rs,./daemon/player/**/*.rs,./daemon/reader/**/*.rs'

      - name: Read and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "kopuz-legacy") | .version'
          )"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${version}"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # A tag is a published release, so it has to carry the project signature —
      # an unsigned APK there would strand everyone who installed a signed one.
      # Validation runs without the secrets (forks, pull requests) stay unsigned.
      - name: Require signing secrets on tags
        if: github.ref_type == 'tag'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KOPUZ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KOPUZ_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "${ANDROID_KEYSTORE_BASE64}" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "${KOPUZ_ANDROID_KEYSTORE_PASSWORD}" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "${KOPUZ_ANDROID_KEY_ALIAS}" ]] || missing+=(ANDROID_KEY_ALIAS)

          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Refusing to publish an unsigned APK. Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Decode the signing keystore
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kopuz.keystore"
          echo "KOPUZ_ANDROID_KEYSTORE=$RUNNER_TEMP/kopuz.keystore" >> "$GITHUB_ENV"

      # ANDROID_NDK_LATEST_HOME is a runner machine variable, invisible to the
      # `env` expression context — it only resolves as a shell expansion here.
      - name: Build the release APK
        env:
          KOPUZ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KOPUZ_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KOPUZ_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          export NDK_HOME="$ANDROID_NDK_HOME"
          ./packaging/android/build-apk.sh

      - name: Create Android checksum
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          apks=(target/android/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected exactly one APK, found ${#apks[@]}"
            exit 1
          fi

          sha256sum "${apks[0]}" | awk '{print $1 "  " substr($2, index($2, "kopuz-"))}' \
            > "${apks[0]}.sha256"

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: kopuz-release-android-${{ steps.version.outputs.version }}
          path: |
            target/android/*.apk
            target/android/*.apk.sha256
          if-no-files-found: error

  publish:
    # A release needs every job; a nightly only the GPUI Linux, macOS and Windows builds, whatever the others did.
    if: >-
      ${{ github.ref_type == 'tag' && !cancelled()
      && needs.linux.result == 'success' && needs.windows.result == 'success'
      && ((contains(github.ref_name, '-nightly.') && needs.macos.result == 'success')
        || (needs.linux-legacy.result == 'success' && needs.macos.result == 'success'
          && needs.macos-legacy.result == 'success' && needs.windows-legacy.result == 'success'
          && needs.android.result == 'success')) }}
    needs: [linux, linux-legacy, macos, macos-legacy, windows, windows-legacy, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ contains(github.ref_name, '-nightly.') && 'kopuz-nightly-*' || 'kopuz-release-*' }}
          path: dist
          merge-multiple: true

      - name: Upload Kopuz Nightly as a pre-release
        if: contains(github.ref_name, '-nightly.')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/*.exe
            dist/*.exe.sha256
            dist/*.dmg
            dist/*.dmg.sha256

      - name: Upload packages to GitHub release
        if: ${{ !contains(github.ref_name, '-nightly.') }}
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.exe
            dist/*.exe.sha256
            dist/*.msi
            dist/*.msi.sha256
            dist/*.apk
            dist/*.apk.sha256

  aur:
    # A bare condition would also wait on publish's own needs, so a nightly's macOS failure would skip this.
    if: ${{ github.ref_type == 'tag' && !cancelled() && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh sudo curl

      - uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ contains(github.ref_name, '-nightly.') && 'kopuz-nightly-linux' || 'kopuz-release-linux-*' }}
          path: dist
          merge-multiple: true

      - name: Fetch the tag's source tarball
        if: ${{ !contains(github.ref_name, '-nightly.') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -fsSL -o "dist/kopuz-${TAG#v}.tar.gz" \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"

      # makepkg refuses root, so the packages are rendered and pushed by an unprivileged builder.
      - name: Publish the AUR packages
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          install -d -m700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/id_ed25519
          chmod 600 /home/builder/.ssh/id_ed25519
          chown -R builder:builder /home/builder/.ssh "$PWD"

          publish() {
            sudo -u builder env \
              HOME=/home/builder \
              PKG="$1" VERSION="$version" SOURCE_FILE="$2" VERIFY="$3" \
              GIT_SSH_COMMAND="ssh -i /home/builder/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
              bash scripts/publish-aur.sh
          }

          if [[ "$TAG" == *-nightly.* ]]; then
            publish kopuz-nightly-bin "$PWD/dist/kopuz-nightly_${version}_amd64.deb" build
            exit 0
          fi
          publish kopuz-bin "$PWD/dist/kopuz_${version}-1_amd64.deb" build
          # A full source build of the legacy app takes most of an hour; the checksum is what can drift.
          publish kopuz-legacy "$PWD/dist/kopuz-${version}.tar.gz" source

  flatpak:
    # Kopuz Nightly's Flatpak wraps the published .deb and is served from R2 at flatpak.kopuz.moe.
    if: >-
      ${{ github.ref_type == 'tag' && contains(github.ref_name, '-nightly.')
      && !cancelled() && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-24.04
    # Each run rewrites the repo's index, so two at once would lose one's commit.
    concurrency:
      group: flatpak-repo
      cancel-in-progress: false
    env:
      MANIFEST_DIR: packaging/kopuz-nightly/flatpak
      AWS_DEFAULT_REGION: auto

    steps:
      - uses: actions/checkout@v4

      - name: Download the Linux packages
        uses: actions/download-artifact@v4
        with:
          name: kopuz-nightly-linux
          path: dist

      - name: Read the R2 secrets and the signing key
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # A pasted secret often ends in a newline, which breaks the request signature.
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            value=$(printf '%s' "${!name}" | tr -d '[:space:]')
            if [[ -z "$value" ]]; then
              echo "::error::$name is empty; check the R2_* secrets"
              exit 1
            fi
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "::error::GPG_PRIVATE_KEY is not set; copy the key kopuz-flatpak signs with"
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "GPG_KEY=$fingerprint" >> "$GITHUB_ENV"

      - name: Install Flatpak tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build onto the published repo
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dpkg-deb -x "dist/kopuz-nightly_${version}_amd64.deb" "$MANIFEST_DIR/payload"
          # The repo's history lives in R2, so this commit lands on top of the nightlies already there.
          aws s3 sync "s3://$R2_BUCKET/repo" repo --endpoint-url "$R2_ENDPOINT" --only-show-errors
          # R2 keeps no empty directories, and ostree will not open a repo missing these.
          if [[ -f repo/config ]]; then
            mkdir -p repo/refs/{heads,mirrors,remotes} repo/objects repo/state repo/tmp/cache repo/extensions
          fi
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --default-branch=stable --gpg-sign="$GPG_KEY" --repo=repo \
            --subject="Kopuz Nightly $version" \
            build "$MANIFEST_DIR/moe.kopuz.kopuz.nightly.yml"
          flatpak build-update-repo --gpg-sign="$GPG_KEY" --title=Kopuz --default-branch=stable \
            --generate-static-deltas --prune --prune-depth=10 repo

      - name: Upload to R2
        run: |
          set -euo pipefail
          s3() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT" --only-show-errors; }
          key=$(gpg --export "$GPG_KEY" | base64 -w0)
          sed "s|@GPGKEY@|$key|" "$MANIFEST_DIR/moe.kopuz.kopuz.nightly.flatpakref.in" > moe.kopuz.kopuz.nightly.flatpakref
          sed "s|@GPGKEY@|$key|" "$MANIFEST_DIR/kopuz.flatpakrepo.in" > kopuz.flatpakrepo
          # Objects first and the index last, so nobody updating mid-upload sees a commit whose objects are missing.
          for dir in objects deltas; do
            if [[ -d "repo/$dir" ]]; then
              s3 sync "repo/$dir" "s3://$R2_BUCKET/repo/$dir" --cache-control "public, max-age=31536000, immutable"
            fi
          done
          s3 sync repo "s3://$R2_BUCKET/repo" --exclude 'objects/*' --exclude 'deltas/*' --exclude 'tmp/*' \
            --cache-control no-cache --delete
          s3 cp moe.kopuz.kopuz.nightly.flatpakref "s3://$R2_BUCKET/moe.kopuz.kopuz.nightly.flatpakref" \
            --cache-control no-cache --content-type application/vnd.flatpak.ref
          s3 cp kopuz.flatpakrepo "s3://$R2_BUCKET/kopuz.flatpakrepo" \
            --cache-control no-cache --content-type application/vnd.flatpak.repo
          # What pruning dropped goes only once the new index no longer names it.
          for dir in objects deltas; do
            if [[ -d "repo/$dir" ]]; then
              s3 sync "repo/$dir" "s3://$R2_BUCKET/repo/$dir" --delete
            fi
          done

  homebrew:
    # The casks carry the stable app; Kopuz Nightly's DMG goes only to its pre-release.
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-nightly.')
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: Kopuz-org/homebrew-tap
          persist-credentials: false

      - name: Checkout the legacy cask
        uses: actions/checkout@v4
        with:
          path: kopuz
          sparse-checkout: packaging/homebrew
          persist-credentials: false

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          pattern: kopuz-release-macos-*
          path: dist
          merge-multiple: true

      - name: Update casks
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"

          bump() {
            local cask="$1" dmg="$2"

            if [[ ! -f "$dmg" ]]; then
              echo "expected $dmg in the release artifacts"
              exit 1
            fi

            local sha
            sha="$(sha256sum "$dmg" | cut -d' ' -f1)"

            sed -i \
              -e "s/^  version \".*\"$/  version \"${version}\"/" \
              -e "s/^  sha256 \".*\"$/  sha256 \"${sha}\"/" \
              "$cask"

            grep -q "version \"${version}\"" "$cask"
            grep -q "sha256 \"${sha}\"" "$cask"
          }

          bump Casks/kopuz.rb "dist/Kopuz_${version}_aarch64.dmg"

          # The first release with a legacy DMG brings its cask into the tap.
          [[ -f Casks/kopuz-legacy.rb ]] || cp kopuz/packaging/homebrew/kopuz-legacy.rb Casks/kopuz-legacy.rb
          bump Casks/kopuz-legacy.rb "dist/Kopuz-Legacy-${version}-aarch64.dmg"

      - name: Commit changes
        env:
          TAP_PAT: ${{ secrets.PAT }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add Casks/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "kopuz ${{ github.ref_name }}"
            git push "https://x-access-token:${TAP_PAT}@github.com/Kopuz-org/homebrew-tap" HEAD
          fi
