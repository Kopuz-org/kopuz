[package]
name = "kopuz"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A modern, lightweight music player built with Rust and GPUI."
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "kopuz"
path = "src/main.rs"

[lints]
workspace = true

# Bundles the release kopuz, kopuzd and kopuzctl already built in the target dir.
[package.metadata.packager]
product-name = "Kopuz"
identifier = "moe.kopuz.kopuz"
publisher = "temidaradev"
authors = ["temidaradev"]
category = "Music"
license-file = "../../../LICENSE"
icons = ["../../legacy/kopuz/assets/logo.png", "../../legacy/kopuz/assets/app.ico"]
# The app spawns kopuzd from its own directory, so both land side by side in every format.
binaries = [
  { path = "kopuz", main = true },
  { path = "kopuzd" },
  { path = "kopuzctl" },
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
info-plist-path = "../../../packaging/kopuz/Info.plist"

[package.metadata.packager.nsis]
installer-icon = "../../legacy/kopuz/assets/app.ico"
template = "../../../packaging/kopuz/installer.nsi"

[package.metadata.packager.wix]
fragment-paths = ["../../../packaging/kopuz/stop-kopuzd.wxs"]
custom-action-refs = ["StopKopuzd"]

[dependencies]
api = { workspace = true }
config = { workspace = true }
i18n = { workspace = true }
link = { workspace = true }
commands = { workspace = true }
store = { workspace = true }
theme = { workspace = true }
components = { path = "../components" }
gpui-kit = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }

library = { path = "../library" }
discover = { path = "../discover" }
page_home = { path = "../page_home" }
page_albums = { path = "../page_albums" }
page_artists = { path = "../page_artists" }
page_playlists = { path = "../page_playlists" }
onboarding = { path = "../onboarding" }
debug_overlay = { path = "../debug_overlay" }
page_radio = { path = "../page_radio" }
page_settings = { path = "../page_settings" }
settings_sources = { path = "../settings_sources" }
settings_interface = { path = "../settings_interface" }
topbar = { path = "../topbar" }
playlists_panel = { path = "../playlists_panel" }
now_playing = { path = "../now_playing" }
palette = { path = "../palette" }
overlays = { path = "../overlays" }
status = { path = "../status" }
metadata_dialog = { path = "../metadata_dialog" }
shortcuts = { path = "../shortcuts" }
profile = { path = "../profile" }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = { workspace = true }
