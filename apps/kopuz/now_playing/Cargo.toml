[package]
name = "now_playing"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
profile = { path = "../profile" }
settings_interface = { path = "../settings_interface" }
api = { workspace = true }
config = { workspace = true }
i18n = { workspace = true }
link = { workspace = true }
store = { workspace = true }
theme = { workspace = true }
components = { path = "../components" }
gpui-kit = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
core-foundation = { workspace = true }
core-video = { workspace = true }
dispatch2 = { workspace = true }
futures = { workspace = true }
objc2 = { workspace = true }
objc2-av-foundation = { workspace = true, features = ["objc2-core-media"] }
objc2-core-media = { workspace = true }
objc2-core-video = { workspace = true }
objc2-foundation = { workspace = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
