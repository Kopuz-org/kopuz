auto_fetch_covers = true
cover_art_darkening = 30
cover_fetch_strategy = "LastFmFirst"
crossfade_seconds = 6
custom_background_path = "/home/me/Pictures/wall.png"
discord_presence = false
hero_height = 640
language = "de"
lyrics_depth_blur_strength = 80
lyrics_offset_ms = 2500
offline_quality = "Kbps256"
spotify_browser = "brave"
sync_interval_minutes = 90
theme = "dracula"
titlebar_mode = "System"
ui_style = "Modern"
volume_scroll_step = 0.1
ytdlp_output_dir = "/home/me/Downloads/kopuz"

[custom_themes.ember]
name = "Ember"

[custom_themes.ember.vars]
--color-bg = "#1a0f0a"

[custom_themes.ocean]
name = "Ocean"

[custom_themes.ocean.vars]
--color-bg = "#0b1d2a"
--color-fg = "#d8e6f0"

[equalizer]
bands = [
    -6.0,
    -3.5,
    0.0,
    1.5,
    3.0,
    4.5,
    6.0,
    -1.0,
    -2.0,
    12.0,
]
enabled = true
preamp_db = -2.5
preset = "Custom"

[[local_sources]]
directories = ["/home/me/Music"]
id = "local"
name = "Local Library"

[[local_sources]]
directories = [
    "/mnt/archive/flac",
    "/mnt/archive/mp3",
]
id = "local:archive"
name = "Archive"

[[radio_registries]]
is_default = true
url = "https://raw.githubusercontent.com/Kopuz-org/kopuz/refs/heads/master/radio-registry/index.json"

[[radio_registries]]
enabled = false
url = "https://example.org/stations/index.json"

[replay_gain]
mode = "Track"
preamp_db = 1.5

[ytdlp_options]
embed_metadata = false
embed_thumbnail = true
organize_by_album = false
overwrite_existing = false
write_thumbnail = true
