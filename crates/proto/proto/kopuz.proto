  TRACK_SORT_ARTIST = 2;
  TRACK_SORT_ALBUM = 3;
  TRACK_SORT_DATE_ADDED = 4;
  TRACK_SORT_PLAY_COUNT = 5;
  // Ordering comes from TrackFilter.sort_fields instead.
  TRACK_SORT_FIELDS = 6;
}

