message DaemonStatus {
  string version = 1;
  reserved 2; // was api_version; the frontend ships with the daemon
  uint64 uptime_secs = 3;
}

// Which entity a cover belongs to. Carried on library rows so a client can
// ask for the image without knowing how it is stored. catalog and station
// name things outside the library: a browse tile, a radio station icon.
message ArtworkTarget {
  oneof entity {
    string track = 1;
    string album = 2;
    string artist = 3;
    string playlist = 4;
    string catalog = 5;
    string station = 6;
  }
}

// The artwork a row has. Absent on a row means there is no picture; do not
// ask for one. version changes when the image would, and never encodes a
// credential, so a client caches bytes under it indefinitely.
message ArtworkRef {
  ArtworkTarget target = 1;
  uint64 version = 2;
}

message ArtworkRequest {
  oneof entity {
    string track = 1;
    string album = 2;
    string artist = 3;
    string playlist = 5;
    string catalog = 6;
    string station = 7;
  }
  bool hq = 4;
}

message ArtworkChunk {
  // Set on the first chunk only.
  string content_type = 1;
  bytes data = 2;
}

// ---------------- shared ----------------

// Stable machine-readable error identity; localize by code, never by
// message. The same codes ride tonic Status metadata (kopuz-error-code)
// for RPC-level failures.
message ErrorBody {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_INPUT = 1;
  reserved 2; // was ERROR_CODE_UNAUTHORIZED
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_CONFLICT = 4;
  ERROR_CODE_SOURCE_AUTH_EXPIRED = 5;
  ERROR_CODE_SOURCE_UNREACHABLE = 6;
  ERROR_CODE_DAEMON_GONE = 9;
  ERROR_CODE_UNSUPPORTED = 7;
  ERROR_CODE_INTERNAL = 8;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_IDLE = 1;
  PHASE_PLAYING = 2;
  PHASE_PAUSED = 3;
  PHASE_ENDED = 4;
}

