// The Kopuz daemon wire contract, v1.
//
// One gRPC endpoint on a Unix domain socket in the user's runtime dir.
// Access control is the socket's file mode: the OS decides who may connect,
// so the channel carries no credentials of its own.
//
// Reads and mutations are unary RPCs. Event delivery is a server-streaming
// subscription with an explicit replay cursor. A client MUST ignore an Event
// whose oneof it does not know (it decodes as unset) and MUST treat unknown
// enum values as their UNSPECIFIED default.

syntax = "proto3";
package kopuz.v1;

service Kopuz {
  // Follows the live event stream from the moment of subscription. A
  // subscriber that falls behind gets one `resync` event and keeps going;
  // fetch the snapshots again when you see it.
  rpc Subscribe(SubscribeRequest) returns (stream EventEnvelope);

  rpc Play(PlayRequest) returns (MutationResult);
  rpc Pause(PauseRequest) returns (MutationResult);
  rpc Toggle(ToggleRequest) returns (MutationResult);
  rpc Next(NextRequest) returns (MutationResult);
  rpc Previous(PreviousRequest) returns (MutationResult);
  rpc Stop(StopRequest) returns (MutationResult);
  rpc Seek(Seek) returns (MutationResult);
  rpc SetVolume(SetVolume) returns (MutationResult);
  rpc SetMode(SetMode) returns (MutationResult);

  rpc GetStatus(GetStatusRequest) returns (DaemonStatus);
  rpc GetPlayerState(GetPlayerStateRequest) returns (PlayerState);
  rpc GetQueue(Page) returns (QueueWindow);
  rpc GetQueueSnapshot(GetQueueSnapshotRequest) returns (QueueSnapshot);
  rpc GetTracks(TracksRequest) returns (TrackPage);
  rpc GetFolderTracks(FolderRequest) returns (TrackPage);
  rpc GetTracksByKeys(TracksByKeysRequest) returns (TrackList);
  rpc GetAlbums(Page) returns (AlbumPage);
  rpc GetAlbum(AlbumRef) returns (AlbumResponse);
  rpc GetAlbumTracks(AlbumTracksRequest) returns (TrackPage);
  rpc GetArtists(Page) returns (ArtistPage);
  rpc GetArtistTracks(ArtistTracksRequest) returns (TrackPage);
  rpc GetArtistSampleTracks(Page) returns (TrackPage);
  rpc GetGenres(GetGenresRequest) returns (GenreList);
  rpc GetTopGenre(GetTopGenreRequest) returns (TopGenreResponse);
  rpc GetGenreTracks(GenreTracksRequest) returns (TrackPage);
  rpc GetRecentTracks(Page) returns (TrackPage);
  rpc Search(SearchRequest) returns (SearchResults);
  rpc GetCatalog(CatalogRequest) returns (CatalogPage);
  rpc GetCatalogDetail(CatalogDetailRequest) returns (CatalogDetail);
  rpc GetRadioStations(GetRadioStationsRequest) returns (RadioStationList);
  rpc SearchRadio(SearchRadioRequest) returns (RadioStationList);
  rpc PinRadioStation(PinRadioStationRequest) returns (Unit);
  rpc RefreshArtistArtwork(RefreshArtistArtworkRequest) returns (Unit);

  rpc GetPlaylists(GetPlaylistsRequest) returns (PlaylistCatalog);
  rpc CreatePlaylist(CreatePlaylistRequest) returns (PlaylistId);
  rpc RenamePlaylist(RenamePlaylistRequest) returns (Unit);
  rpc DeletePlaylist(PlaylistId) returns (Unit);
  rpc AddPlaylistTracks(AddPlaylistTracksRequest) returns (Unit);
  rpc RemovePlaylistTrack(RemovePlaylistTrackRequest) returns (Unit);
  rpc ReorderPlaylist(ReorderPlaylistRequest) returns (Unit);
  rpc RefreshPlaylist(PlaylistId) returns (Unit);
  rpc CreatePlaylistFolder(CreatePlaylistFolderRequest) returns (PlaylistFolderId);
  rpc RenamePlaylistFolder(RenamePlaylistFolderRequest) returns (Unit);
  rpc DeletePlaylistFolder(PlaylistFolderId) returns (Unit);
  rpc MovePlaylist(MovePlaylistRequest) returns (Unit);
  rpc GetStats(GetStatsRequest) returns (Stats);
  rpc GetLyrics(TrackRef) returns (Lyrics);
  rpc GetFavorites(GetFavoritesRequest) returns (Favorites);
  rpc GetJobs(GetJobsRequest) returns (JobList);
  rpc GetDownloads(GetDownloadsRequest) returns (DownloadList);
  rpc GetConfig(GetConfigRequest) returns (ConfigView);

  rpc SetQueue(SetQueueRequest) returns (MutationResult);
  rpc EditQueue(QueueEditRequest) returns (MutationResult);
  rpc SetFavorite(FavoriteRequest) returns (SetFavoriteResponse);
  rpc UpdateTrackMetadata(TrackMetadataPatch) returns (TrackInfo);
  rpc DeleteTracks(DeleteTracksRequest) returns (Unit);
  rpc DeleteAlbum(DeleteAlbumRequest) returns (Unit);
  rpc UploadArtwork(ArtworkUpload) returns (Unit);
  rpc RemoveArtwork(ArtworkTarget) returns (Unit);
  rpc StartJob(StartJobRequest) returns (JobRef);
  rpc CancelJob(JobId) returns (CancelJobResponse);
  rpc StartDownloads(DownloadRequest) returns (JobRef);
  rpc StartYtdlp(YtdlpRequest) returns (JobRef);
  rpc RemoveDownload(TrackRef) returns (RemoveDownloadResponse);
  rpc SetConfig(SetConfigRequest) returns (ConfigView);

  rpc GetSources(GetSourcesRequest) returns (SourceList);
  rpc SelectSource(SourceId) returns (SourceInfo);
  rpc UpsertLocalSource(LocalSourceDraft) returns (SourceInfo);
  rpc DeleteLocalSource(SourceId) returns (Unit);
  rpc SetSourceDirectories(SetSourceDirectoriesRequest) returns (SourceInfo);
  rpc UpsertServer(ServerDraft) returns (SourceInfo);
  rpc DeleteServer(SourceId) returns (Unit);
  rpc ProvisionCredentials(CredentialProvision) returns (SourceInfo);
  rpc LoginSource(SourceLoginRequest) returns (SourceInfo);
  rpc ClearCredentials(SourceId) returns (Unit);
  rpc AuthenticateSource(SourceId) returns (SourceInfo);
  rpc BrowseSource(BrowseSourceRequest) returns (SourceFolderList);
  rpc ValidateSource(SourceId) returns (SourceStateResponse);
  rpc GetIntegrations(GetIntegrationsRequest) returns (IntegrationList);
  rpc ProvisionIntegration(IntegrationProvision) returns (IntegrationStatus);
  rpc ClearIntegration(IntegrationRef) returns (Unit);
  rpc AuthenticateIntegration(IntegrationRef) returns (IntegrationStatus);

  rpc GetArtwork(ArtworkRequest) returns (stream ArtworkChunk);
}

// One message per RPC even when it carries nothing, so any of them can gain
// a field without a signature change. Unit is the marker inside oneofs.
message Unit {}

message PlayRequest {}
message PauseRequest {}
message ToggleRequest {}
message NextRequest {}
message PreviousRequest {}
message StopRequest {}
message GetStatusRequest {}
message GetPlayerStateRequest {}
message GetStatsRequest {}
message GetFavoritesRequest {}
message GetJobsRequest {}
message GetDownloadsRequest {}
message GetConfigRequest {}
message SetFavoriteResponse {}
message CancelJobResponse {}
message RemoveDownloadResponse {}

// ---------------- event subscription ----------------

message SubscribeRequest {
  reserved 1; // was after_sequence, from the replay-cursor design
}

message EventEnvelope {
  reserved 1; // was sequence, from the replay-cursor design
  Event event = 2;
}

message Seek {
  uint64 position_ms = 1;
}

message SetVolume {
  // 0.0 to 1.0.
  float volume = 1;
}

message SetMode {
  optional bool shuffle = 1;
  optional LoopMode loop = 2;
}

message MutationResult {
  // State revision containing the mutation's effect.
  uint64 rev = 1;
}

// ---------------- events ----------------

message Event {
  oneof kind {
    PlayerState player_state = 1;
    PositionEvent position = 2;
    BufferedEvent buffered = 3;
    QueueChanged queue_changed = 5;
    LibraryInvalidated library_invalidated = 6;
    JobProgress job_progress = 7;
    JobFinished job_finished = 8;
    ConfigChanged config_changed = 9;
    SourceStatusEvent source_status = 10;
    Notice notice = 11;
    // The reconnect gap exceeded the replay ring: refetch snapshots.
    Unit resync = 12;
  }
}

message PositionEvent {
  uint64 token = 1;
  uint64 position_ms = 2;
  uint64 at_ms = 3;
  bool playing = 4;
}

message BufferedEvent {
  uint64 token = 1;
  repeated BufferedRange ranges = 2;
}

message QueueChanged {
  uint64 rev = 1;
  uint32 length = 2;
  optional uint32 index = 3;
}

message LibraryInvalidated {
  Table table = 1;
  reserved 2; // was generation: independent writers, never a shared counter
}

message JobProgress {
  string id = 1;
  JobKind kind = 2;
  string phase = 3;
  optional uint64 current = 4;
  optional uint64 total = 5;
  optional string message = 6;
}

message JobFinished {
  string id = 1;
  JobKind kind = 2;
  bool ok = 3;
  optional ErrorBody error = 4;
}

message ConfigChanged {
  repeated string keys = 1;
}

message SourceStatusEvent {
  string source = 1;
  SourceState state = 2;
}

message Notice {
  NoticeLevel level = 1;
  string code = 2;
  optional string message = 3;
}

// ---------------- player state ----------------

message PlayerState {
  uint64 rev = 1;
  // Daemon monotonic clock at send time; pairs with position.at_ms so
  // clients compute one clock offset and interpolate locally. There is no
  // per-second tick stream.
  uint64 now_ms = 2;
  Phase phase = 3;
  Intent intent = 4;
  optional NowPlaying track = 5;
  optional PositionAnchor position = 6;
  QueueSummary queue = 7;
  float volume = 8;
  repeated BufferedRange buffered = 9;
  // While present, keep displaying this track and drive the seek bar from
  // its position_ms (a crossfade is resolving).
  optional FadingState fading = 10;
  optional ExternalPlayback external = 11;
  optional ErrorBody error = 12;
  optional uint64 output_latency_ms = 13;
}

// phase is engine truth; intent is what the daemon is trying to do.
// Frontends render optimistic UI from intent, exactly like the built-in
// GUI (pause glyph while loading).
message Intent {
  oneof kind {
    Unit stopped = 1;
    Loading loading = 2;
    Committed committed = 3;
  }
  message Loading {
    uint64 token = 1;
    optional uint64 from_token = 2;
  }
  message Committed {
    uint64 token = 1;
  }
}

message NowPlaying {
  // key is the library ref and the GetArtwork entity id; uid is the
  // source-qualified identity. Same meaning as on TrackInfo.
  string key = 1;
  string uid = 10;
  string title = 2;
  string artist = 3;
  string album = 4;
  optional uint64 duration_ms = 5;
  uint32 khz = 6;
  uint32 bitrate = 7;
  TrackKind kind = 8;
  bool seekable = 9;
  optional ArtworkRef artwork = 11;
}

message PositionAnchor {
  uint64 ms = 1;
  uint64 at_ms = 2;
  bool playing = 3;
}

message BufferedRange {
  uint64 start = 1;
  uint64 end = 2;
  optional uint64 total = 3;
}

message FadingState {
  uint64 from_token = 1;
  NowPlaying track = 2;
  uint64 position_ms = 3;
}

message ExternalPlayback {
  string kind = 1;
  optional string device = 2;
}

message QueueSummary {
  uint64 rev = 1;
  uint32 length = 2;
  optional uint32 index = 3;
  bool shuffle = 4;
  LoopMode loop = 5;
}

// ---------------- queue ----------------

message SetQueueRequest {
  QueueMode mode = 1;
  QueueContext context = 2;
  // replace mode only.
  optional uint32 start_index = 3;
  optional bool shuffle = 4;
}

// Reference-shaped contexts materialize daemon-side, so "play this album"
// never round-trips a track list through the client.
message QueueContext {
  oneof kind {
    TrackKeys tracks = 1;
    Id album = 2;
    Name artist = 3;
    Name genre = 4;
    Id playlist = 5;
    TrackFilter filter = 6;
    Radio radio = 7;
    // The source's mix seeded by a track or a playlist. The daemon fetches
    // it and pins the seed at the front.
    Key track_radio = 8;
    Id playlist_radio = 9;
  }
  message TrackKeys {
    repeated string keys = 1;
  }
  message Id {
    string id = 1;
  }
  message Key {
    string key = 1;
  }
  message Name {
    string name = 1;
  }
  message Radio {
    string station_id = 1;
    string stream_id = 2;
  }
}

// Positions are play-order (logical) indices, the same space
// QueueSummary.index and QueueItem.index use.
message QueueEditRequest {
  oneof op {
    Jump jump = 1;
    Move move = 2;
    Remove remove = 3;
    // Index into the UNSHUFFLED queue; the shuffle order is re-pinned so the
    // named track plays now and the rest follows it.
    Jump jump_physical = 4;
    Insert insert = 5;
  }
  message Jump {
    uint32 index = 1;
  }
  message Move {
    uint32 from = 1;
    uint32 to = 2;
  }
  message Remove {
    uint32 index = 1;
  }
  message Insert {
    uint32 index = 1;
    repeated string keys = 2;
  }
}

message Page {
  uint32 offset = 1;
  // 0 means the server default (200).
  uint32 limit = 2;
}

message QueueWindow {
  uint64 rev = 1;
  uint32 total = 2;
  uint32 offset = 3;
  repeated QueueItem items = 4;
}

message QueueItem {
  uint32 index = 1;
  TrackInfo track = 2;
}

message GetQueueSnapshotRequest {}

// The whole queue at once: what a frontend needs to render a queue view, a
// shuffle order, and "is this queued?" checks without paging.
message QueueSnapshot {
  uint64 rev = 1;
  repeated TrackInfo items = 2;
  // Play-order position -> unshuffled index. Empty while shuffle is off.
  repeated uint32 shuffle_order = 3;
  optional uint32 position = 4;
  bool shuffle = 5;
}

// ---------------- library ----------------

message TrackFilter {
  optional string search = 1;
  optional string artist = 2;
  optional string album = 3;
  optional string genre = 4;
  optional bool favorite = 5;
  reserved 6; // was a free-form `sort` string
  TrackSort sort = 7;
  // Set when sort is TRACK_SORT_FIELDS: the first criterion decides, the
  // rest break ties.
  repeated SortCriterion sort_fields = 8;
}

message SortCriterion {
  TrackSortField field = 1;
  bool descending = 2;
}

message TracksRequest {
  TrackFilter filter = 1;
  Page page = 2;
}

message FolderRequest {
  string prefix = 1;
  Page page = 2;
}

message TrackPage {
  uint32 total = 1;
  uint32 offset = 2;
  repeated TrackInfo items = 3;
}

message TrackList {
  repeated TrackInfo items = 1;
}

message TracksByKeysRequest {
  repeated string keys = 1;
}

message AlbumInfo {
  string id = 1;
  string title = 2;
  string artist = 3;
  string genre = 4;
  uint32 year = 5;
  // Absent when the daemon has no cover for the album.
  optional ArtworkRef artwork = 6;
}

message AlbumPage {
  repeated AlbumInfo albums = 1;
  uint32 total = 2;
}

message AlbumRef {
  string id = 1;
}

message AlbumResponse {
  optional AlbumInfo album = 1;
}

message AlbumTracksRequest {
  string id = 1;
  Page page = 2;
}

message ArtistInfo {
  string name = 1;
  uint32 track_count = 2;
  optional ArtworkRef artwork = 3;
}

message ArtistPage {
  repeated ArtistInfo artists = 1;
  uint32 total = 2;
}

message ArtistTracksRequest {
  string artist = 1;
  Page page = 2;
}

message GetGenresRequest {}

message GenreList {
  repeated string genres = 1;
}

message GetTopGenreRequest {}

message TopGenreResponse {
  optional string genre = 1;
}

message GenreTracksRequest {
  string genre = 1;
  Page page = 2;
}

message SearchRequest {
  string query = 1;
}

message RefreshArtistArtworkRequest {
  repeated string names = 1;
}

message SearchResults {
  repeated TrackInfo tracks = 1;
  repeated AlbumInfo albums = 2;
}

// ---------------- playlists ----------------

// ---------------- sources ----------------

// No credential appears in any of these. A source says whether it is
// authenticated, never with what.
enum SourceKind {
  SOURCE_KIND_UNKNOWN = 0;
  SOURCE_KIND_LOCAL = 1;
  SOURCE_KIND_LOCAL_LIBRARY = 2;
  SOURCE_KIND_SERVER = 3;
}

enum PlaylistCapability {
  PLAYLIST_CAPABILITY_NONE = 0;
  PLAYLIST_CAPABILITY_ADD_REMOVE = 1;
  PLAYLIST_CAPABILITY_REORDER = 2;
}

enum ArtistPresentation {
  ARTIST_PRESENTATION_LIBRARY = 0;
  ARTIST_PRESENTATION_REMOTE = 1;
}

enum AlbumPresentation {
  ALBUM_PRESENTATION_STANDARD = 0;
  ALBUM_PRESENTATION_REMOTE = 1;
}

enum FavoritesSyncMode {
  FAVORITES_SYNC_INSTANT = 0;
  FAVORITES_SYNC_PAGINATED = 1;
}

// Every "should this button exist?" question is answered from here, so no
// frontend branches on a service name.
message SourceCapabilities {
  bool edit_tags = 1;
  bool delete_from_disk = 2;
  bool scan_folders = 3;
  bool folders = 4;
  bool sync = 5;
  bool downloads = 6;
  bool discover = 7;
  bool track_radio = 8;
  bool playlist_radio = 9;
  PlaylistCapability playlists = 10;
  ArtistPresentation artists = 11;
  AlbumPresentation albums = 12;
  FavoritesSyncMode favorites_sync = 13;
}

message SourceInfo {
  string id = 1;
  string name = 2;
  SourceKind kind = 3;
  optional MusicService service = 4;
  bool active = 5;
  bool authenticated = 6;
  SourceCapabilities capabilities = 7;
  optional string url = 8;
  optional string browser = 9;
  bool anonymous = 10;
  optional string storefront = 11;
  optional string language = 12;
  repeated string directories = 13;
}

message GetSourcesRequest {}

message SourceList {
  repeated SourceInfo sources = 1;
}

message SourceId {
  string id = 1;
}

message LocalSourceDraft {
  // Absent creates a new local library.
  optional string id = 1;
  string name = 2;
  repeated string directories = 3;
}

message ServerDraft {
  optional string id = 1;
  string name = 2;
  string url = 3;
  MusicService service = 4;
  optional string browser = 5;
  bool anonymous = 6;
  optional string storefront = 7;
  optional string language = 8;
}

message SetSourceDirectoriesRequest {
  string id = 1;
  repeated string directories = 2;
}

// Write-only. No response carries these values back.
message CredentialProvision {
  string server_id = 1;
  string secret = 2;
  optional string user_id = 3;
  optional string browser = 4;
}

message SourceLoginRequest {
  string server_id = 1;
  string username = 2;
  string password = 3;
}

message BrowseSourceRequest {
  string id = 1;
  string path = 2;
}

message SourceFolderEntry {
  string path = 1;
  string name = 2;
}

message SourceFolderList {
  repeated SourceFolderEntry entries = 1;
}

message SourceStateResponse {
  SourceState state = 1;
}

enum IntegrationKind {
  INTEGRATION_UNKNOWN = 0;
  INTEGRATION_LISTENBRAINZ = 1;
  INTEGRATION_LASTFM = 2;
  INTEGRATION_LIBREFM = 3;
}

message IntegrationRef {
  IntegrationKind kind = 1;
}

message GetIntegrationsRequest {}

message IntegrationStatus {
  IntegrationKind kind = 1;
  bool configured = 2;
}

message IntegrationList {
  repeated IntegrationStatus integrations = 1;
}

// Write-only scrobbling credentials.
message IntegrationProvision {
  IntegrationKind kind = 1;
  optional string token = 2;
  optional string api_key = 3;
  optional string api_secret = 4;
  optional string session_key = 5;
}

// ---------------- mutations ----------------

// What to do with an entity's picture. Absent means leave it alone.
message ArtworkChange {
  oneof change {
    Unit remove = 1;
    bytes set = 2;
  }
}

// A field left unset keeps its current value; the clear_* flags remove a
// number, since "unset" already means "unchanged".
message TrackMetadataPatch {
  string key = 1;
  optional string title = 2;
  optional string artist = 3;
  optional string album = 4;
  optional uint32 track_number = 5;
  bool clear_track_number = 6;
  optional uint32 disc_number = 7;
  bool clear_disc_number = 8;
  optional ArtworkChange cover = 9;
}

message DeleteTracksRequest {
  repeated string keys = 1;
  // Also unlink the files. Refused outside the configured library roots.
  bool from_disk = 2;
}

message DeleteAlbumRequest {
  string id = 1;
  bool from_disk = 2;
}

message ArtworkUpload {
  ArtworkTarget target = 1;
  string content_type = 2;
  bytes bytes = 3;
}

// ---------------- catalog ----------------

// The source's own browse feed. Songs arrive as ordinary TrackInfo, and the
// daemon remembers them, so queueing a browse row is the same call as
// queueing a library track.
enum CatalogItemKind {
  CATALOG_ITEM_UNKNOWN = 0;
  CATALOG_ITEM_TRACK = 1;
  CATALOG_ITEM_ALBUM = 2;
  CATALOG_ITEM_PLAYLIST = 3;
  CATALOG_ITEM_ARTIST = 4;
  CATALOG_ITEM_MOOD = 5;
}

message CatalogItem {
  CatalogItemKind kind = 1;
  string id = 2;
  string title = 3;
  optional string subtitle = 4;
  optional ArtworkRef artwork = 5;
  // Set for tracks, so a shelf of songs is playable without a second call.
  optional TrackInfo track = 6;
}

message CatalogShelf {
  string title = 1;
  optional string strapline = 2;
  repeated CatalogItem items = 3;
  optional string more_ref = 4;
  bool list = 5;
}

message CatalogRequest {
  optional string continuation = 1;
}

message CatalogPage {
  repeated CatalogShelf shelves = 1;
  optional string continuation = 2;
}

message CatalogDetailRequest {
  CatalogItemKind kind = 1;
  string id = 2;
  optional string continuation = 3;
}

message CatalogDetail {
  CatalogItemKind kind = 1;
  string id = 2;
  string title = 3;
  optional string subtitle = 4;
  optional string description = 5;
  optional ArtworkRef artwork = 6;
  optional string playback_id = 7;
  optional string year = 8;
  repeated TrackInfo tracks = 9;
  repeated CatalogShelf shelves = 10;
  optional string continuation = 11;
}

// ---------------- radio ----------------

// Stream URLs never appear here: a client names a station and one of its
// streams, and the daemon resolves the rest.
message RadioStreamInfo {
  string id = 1;
  // May be a translation key; the client owns the locale.
  string name = 2;
}

message RadioStationInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string tags = 4;
  repeated RadioStreamInfo streams = 5;
  bool pinned = 6;
  optional ArtworkRef artwork = 7;
}

message GetRadioStationsRequest {}

message RadioStationList {
  repeated RadioStationInfo stations = 1;
}

message SearchRadioRequest {
  string query = 1;
  uint32 limit = 2;
}

message PinRadioStationRequest {
  string id = 1;
  bool pinned = 2;
}

message GetPlaylistsRequest {}

message PlaylistInfo {
  string id = 1;
  string name = 2;
  // Library refs, in playlist order; resolve with GetTracksByKeys.
  repeated string track_keys = 3;
  optional ArtworkRef artwork = 4;
}

message PlaylistFolderInfo {
  string id = 1;
  string name = 2;
  repeated string playlist_ids = 3;
}

message PlaylistCatalog {
  repeated PlaylistInfo playlists = 1;
  repeated PlaylistFolderInfo folders = 2;
}

message PlaylistId {
  string id = 1;
}

message PlaylistFolderId {
  string id = 1;
}

message CreatePlaylistRequest {
  string name = 1;
  repeated string keys = 2;
}

message RenamePlaylistRequest {
  string id = 1;
  string name = 2;
}

message AddPlaylistTracksRequest {
  string id = 1;
  repeated string keys = 2;
}

message RemovePlaylistTrackRequest {
  string id = 1;
  // Position, not key: a playlist may hold the same track twice.
  uint32 index = 2;
}

message ReorderPlaylistRequest {
  string id = 1;
  uint32 from = 2;
  uint32 to = 3;
}

message CreatePlaylistFolderRequest {
  string name = 1;
}

message RenamePlaylistFolderRequest {
  string id = 1;
  string name = 2;
}

message MovePlaylistRequest {
  string playlist_id = 1;
  // Absent takes the playlist out of every folder.
  optional string folder_id = 2;
}

message TrackInfo {
  // The stable library ref; use it for queueing, favorites, and artwork.
  string key = 1;
  string uid = 2;
  string title = 3;
  string artist = 4;
  string album = 5;
  string album_id = 6;
  optional uint64 duration_ms = 7;
  uint32 khz = 8;
  uint32 bitrate = 9;
  optional uint32 track_number = 10;
  optional uint32 disc_number = 11;
  TrackKind kind = 12;
  bool seekable = 13;
  bool offline = 14;
  // Absent for a local file.
  optional MusicService service = 15;
  // Every credited artist, where the source separates them.
  repeated string artists = 16;
  optional string musicbrainz_release_id = 17;
  optional string musicbrainz_recording_id = 18;
  optional string musicbrainz_track_id = 19;
  optional string playlist_item_id = 20;
  // Absent when there is no cover.
  optional ArtworkRef artwork = 21;
}

message TrackRef {
  string key = 1;
}

message Stats {
  map<string, uint64> listen_counts = 1;
}

message Lyrics {
  optional string plain = 1;
  repeated LyricLine synced = 2;
}

message LyricLine {
  uint64 start_ms = 1;
  optional uint64 end_ms = 2;
  string text = 3;
  // Word or syllable timing where the provider has it.
  repeated LyricChunk chunks = 4;
  optional uint32 parent_line_index = 5;
  bool background = 6;
  bool opposite_turn = 7;
}

message LyricChunk {
  uint64 start_ms = 1;
  string text = 2;
}

// ---------------- favorites, jobs, downloads ----------------

message Favorites {
  repeated string refs = 1;
  uint64 generation = 2;
}

message FavoriteRequest {
  string key = 1;
  bool favorite = 2;
}

message StartJobRequest {
  JobKind kind = 1;
}

message JobRef {
  string job_id = 1;
}

message JobId {
  string id = 1;
}

message JobList {
  repeated JobStatus jobs = 1;
}

message JobStatus {
  string id = 1;
  JobKind kind = 2;
  JobState state = 3;
  string phase = 4;
  optional uint64 current = 5;
  optional uint64 total = 6;
  optional string message = 7;
  optional ErrorBody error = 8;
}

// Options are the typed settings struct: the daemon builds the command
// line, so it has to understand them rather than forward opaque JSON.
enum YtdlpAudioFormat {
  YTDLP_FORMAT_BEST_AUDIO = 0;
  YTDLP_FORMAT_MP3 = 1;
  YTDLP_FORMAT_FLAC = 2;
  YTDLP_FORMAT_OPUS = 3;
  YTDLP_FORMAT_WAV = 4;
  YTDLP_FORMAT_VIDEO = 5;
}

message YtdlpRequest {
  string url = 1;
  // Empty means the daemon default.
  string output_dir = 2;
  YtdlpAudioFormat format = 3;
  YtdlpOptions options = 4;
}

message DownloadRequest {
  repeated string keys = 1;
}

message DownloadList {
  repeated string keys = 1;
}

// ---------------- config, status, artwork ----------------

// The settings surface as a real message. Credential keys and machine-local
// path state never leave the daemon; locked_keys are pinned by a managed
// settings layer (a read-only or Nix-store settings.toml, a drop-in, or an
// env override) and render read-only.
message ConfigView {
  Config config = 1;
  repeated string locked_keys = 2;
}

// Replaces the settings surface wholesale: read the view, change what you
// want, send it back. A locked key whose value actually differs is refused.
message SetConfigRequest {
  Config config = 1;
}



// ---------------- config ----------------

// A source is Local, a named local library, or a server; the id carries the
// namespace (`local:<uuid>` or the server id) exactly as AppConfig holds it.
message SourceRef {
  oneof kind {
    Unit local = 1;
    string local_library = 2;
    string server = 3;
  }
}

// proto maps cannot hold a repeated value, so the folder list is wrapped.
message StringList {
  repeated string values = 1;
}

message SavedLocalSource {
  string id = 1;
  string name = 2;
  repeated string directories = 3;
}

message HomeSection {
  string key = 1;
  bool enabled = 2;
}

message RegistryEntry {
  string url = 1;
  bool enabled = 2;
  bool is_default = 3;
}

message CustomTheme {
  string name = 1;
  map<string, string> vars = 2;
}

message YtdlpHistoryEntry {
  string url = 1;
  string title = 2;
  string format = 3;
  string status = 4;
  optional string error = 5;
}

message EqualizerSettings {
  bool enabled = 1;
  EqPreset preset = 2;
  // Exactly ten bands; a different length is rejected at the boundary.
  repeated float bands = 3;
  float preamp_db = 4;
}

message AlbumSortCriterion {
  AlbumSortField field = 1;
  SortDirection direction = 2;
}

message TrackSortCriterion {
  TrackSortField field = 1;
  SortDirection direction = 2;
}

message ArtistSortCriterion {
  ArtistSortField field = 1;
  SortDirection direction = 2;
}

message YtdlpOptions {
  bool embed_metadata = 1;
  bool embed_thumbnail = 2;
  bool postprocess_thumbnail_square = 3;
  bool embed_chapters = 4;
  bool embed_subs = 5;
  bool embed_info_json = 6;
  bool write_thumbnail = 7;
  bool write_description = 8;
  bool write_info_json = 9;
  bool write_subs = 10;
  bool write_auto_subs = 11;
  bool write_comments = 12;
  bool sponsorblock = 13;
  bool sponsorblock_mark = 14;
  bool split_chapters = 15;
  string convert_thumbnail = 16;
  bool no_playlist = 17;
  bool xattrs = 18;
  bool no_mtime = 19;
  string rate_limit = 20;
  string cookies_from_browser = 21;
  string js_runtimes = 22;
  uint32 audio_quality = 23;
}

// The settings surface, mirroring config::AppConfig minus the keys the
// daemon never sends: credentials and machine-local path state.
message Config {
  repeated SavedLocalSource local_sources = 1;
  SourceRef active_source = 2;
  bool source_explicitly_set = 3;
  map<string, StringList> server_folders = 4;
  optional string spotify_browser = 5;
  bool spotify_prefer_active_device = 6;
  repeated string music_directory = 7;
  string theme = 8;
  string live_theme_path = 9;
  string device_id = 10;
  optional bool discord_presence = 11;
  optional bool discord_presence_paused = 12;
  optional bool discord_presence_source = 13;
  SortOrder sort_order = 14;
  repeated AlbumSortCriterion album_sort = 15;
  repeated TrackSortCriterion library_sort = 16;
  repeated AlbumSortCriterion artist_album_sort = 17;
  repeated ArtistSortCriterion artist_sort = 18;
  AlbumViewMode album_view_mode = 19;
  AlbumViewMode artist_album_view_mode = 20;
  AlbumViewMode artists_view_mode = 21;
  ArtistViewOrder artist_view_order = 22;
  map<string, uint64> listen_counts = 23;
  string language = 24;
  bool reduce_animations = 25;
  bool fullscreen_use_player_bar = 26;
  bool fullscreen_tabs_collapsed = 27;
  bool cover_art_background = 28;
  uint32 cover_art_darkening = 29;
  uint32 cover_art_blur = 30;
  string custom_background_path = 31;
  string custom_font_path = 32;
  bool tracing_enabled = 33;
  bool auto_check_updates = 34;
  bool minimize_to_tray = 35;
  bool show_source_toggle = 36;
  bool show_row_images = 37;
  repeated string sidebar_order = 38;
  float volume = 39;
  float volume_scroll_step = 40;
  uint32 crossfade_seconds = 41;
  map<string, CustomTheme> custom_themes = 42;
  BackBehavior back_behavior = 43;
  ChannelMode channel_mode = 44;
  EqualizerSettings equalizer = 45;
  DeviceChangeBehavior device_change_behavior = 46;
  SampleRateMode sample_rate_mode = 47;
  string ytdlp_output_dir = 48;
  YtdlpOptions ytdlp_options = 49;
  repeated YtdlpHistoryEntry ytdlp_history = 50;
  TitlebarMode titlebar_mode = 51;
  OfflineQuality offline_quality = 52;
  PlayerBarPosition player_bar_position = 53;
  UiStyle ui_style = 54;
  SettingsLayout settings_layout = 55;
  uint32 hero_height = 56;
  repeated HomeSection home_sections = 57;
  ListenNowStyle listen_now_style = 58;
  bool auto_fetch_covers = 59;
  FetchStrategy cover_fetch_strategy = 60;
  repeated RegistryEntry radio_registries = 61;
  repeated string pinned_stations = 62;
  bool prefer_local_lyrics = 63;
  bool enable_musixmatch_lyrics = 64;
  int32 lyrics_offset_ms = 65;
  bool lyrics_offset_auto = 66;
  bool lyrics_depth_blur = 67;
  uint32 lyrics_depth_blur_strength = 68;
}

