// The Kopuz daemon wire contract, v1.
//
// One gRPC endpoint on a Unix domain socket in the user's runtime dir.
// Access control is the socket's file mode: the OS decides who may connect,
// so the channel carries no credentials of its own.
//
// Reads and mutations are unary RPCs. Event delivery is a server-streaming
// subscription with an explicit replay cursor. A client MUST ignore an Event
// whose oneof it does not know (it decodes as unset) and MUST treat unknown
// enum values as their UNSPECIFIED default.

syntax = "proto3";
package kopuz.v1;

service Kopuz {
  // Follows the live event stream from the moment of subscription. A
  // subscriber that falls behind gets one `resync` event and keeps going;
  // fetch the snapshots again when you see it.
  rpc Subscribe(SubscribeRequest) returns (stream EventEnvelope);

  rpc Play(PlayRequest) returns (MutationResult);
  rpc Pause(PauseRequest) returns (MutationResult);
  rpc Toggle(ToggleRequest) returns (MutationResult);
  rpc Next(NextRequest) returns (MutationResult);
  rpc Previous(PreviousRequest) returns (MutationResult);
  rpc Stop(StopRequest) returns (MutationResult);
  rpc Seek(Seek) returns (MutationResult);
  rpc SetVolume(SetVolume) returns (MutationResult);
  rpc SetMode(SetMode) returns (MutationResult);

  rpc GetStatus(GetStatusRequest) returns (DaemonStatus);
  rpc GetPlayerState(GetPlayerStateRequest) returns (PlayerState);
  rpc GetQueue(Page) returns (QueueWindow);
  rpc GetTracks(TracksRequest) returns (TrackPage);
  rpc GetFolderTracks(FolderRequest) returns (TrackPage);
  rpc GetStats(GetStatsRequest) returns (Stats);
  rpc GetLyrics(TrackRef) returns (Lyrics);
  rpc GetFavorites(GetFavoritesRequest) returns (Favorites);
  rpc GetJobs(GetJobsRequest) returns (JobList);
  rpc GetDownloads(GetDownloadsRequest) returns (DownloadList);
  rpc GetConfig(GetConfigRequest) returns (ConfigView);

  rpc SetQueue(SetQueueRequest) returns (MutationResult);
  rpc EditQueue(QueueEditRequest) returns (MutationResult);
  rpc SetFavorite(FavoriteRequest) returns (SetFavoriteResponse);
  rpc StartJob(StartJobRequest) returns (JobRef);
  rpc CancelJob(JobId) returns (CancelJobResponse);
  rpc StartDownloads(DownloadRequest) returns (JobRef);
  rpc RemoveDownload(TrackRef) returns (RemoveDownloadResponse);
  rpc SetConfig(SetConfigRequest) returns (ConfigView);

  rpc GetArtwork(ArtworkRequest) returns (stream ArtworkChunk);
}

// One message per RPC even when it carries nothing, so any of them can gain
// a field without a signature change. Unit is the marker inside oneofs.
message Unit {}

message PlayRequest {}
message PauseRequest {}
message ToggleRequest {}
message NextRequest {}
message PreviousRequest {}
message StopRequest {}
message GetStatusRequest {}
message GetPlayerStateRequest {}
message GetStatsRequest {}
message GetFavoritesRequest {}
message GetJobsRequest {}
message GetDownloadsRequest {}
message GetConfigRequest {}
message SetFavoriteResponse {}
message CancelJobResponse {}
message RemoveDownloadResponse {}

// ---------------- event subscription ----------------

message SubscribeRequest {
  reserved 1; // was after_sequence, from the replay-cursor design
}

message EventEnvelope {
  reserved 1; // was sequence, from the replay-cursor design
  Event event = 2;
}

message Seek {
  uint64 position_ms = 1;
}

message SetVolume {
  // 0.0 to 1.0.
  float volume = 1;
}

message SetMode {
  optional bool shuffle = 1;
  optional LoopMode loop = 2;
}

message MutationResult {
  // State revision containing the mutation's effect.
  uint64 rev = 1;
}

// ---------------- events ----------------

message Event {
  oneof kind {
    PlayerState player_state = 1;
    PositionEvent position = 2;
    BufferedEvent buffered = 3;
    QueueChanged queue_changed = 5;
    LibraryInvalidated library_invalidated = 6;
    JobProgress job_progress = 7;
    JobFinished job_finished = 8;
    ConfigChanged config_changed = 9;
    SourceStatusEvent source_status = 10;
    Notice notice = 11;
    // The reconnect gap exceeded the replay ring: refetch snapshots.
    Unit resync = 12;
  }
}

message PositionEvent {
  uint64 token = 1;
  uint64 position_ms = 2;
  uint64 at_ms = 3;
  bool playing = 4;
}

message BufferedEvent {
  uint64 token = 1;
  repeated BufferedRange ranges = 2;
}

message QueueChanged {
  uint64 rev = 1;
  uint32 length = 2;
  optional uint32 index = 3;
}

message LibraryInvalidated {
  Table table = 1;
  uint64 generation = 2;
}

message JobProgress {
  string id = 1;
  JobKind kind = 2;
  string phase = 3;
  optional uint64 current = 4;
  optional uint64 total = 5;
  optional string message = 6;
}

message JobFinished {
  string id = 1;
  JobKind kind = 2;
  bool ok = 3;
  optional ErrorBody error = 4;
}

message ConfigChanged {
  repeated string keys = 1;
}

message SourceStatusEvent {
  string source = 1;
  SourceState state = 2;
}

message Notice {
  NoticeLevel level = 1;
  string code = 2;
  optional string message = 3;
}

// ---------------- player state ----------------

message PlayerState {
  uint64 rev = 1;
  // Daemon monotonic clock at send time; pairs with position.at_ms so
  // clients compute one clock offset and interpolate locally. There is no
  // per-second tick stream.
  uint64 now_ms = 2;
  Phase phase = 3;
  Intent intent = 4;
  optional NowPlaying track = 5;
  optional PositionAnchor position = 6;
  QueueSummary queue = 7;
  float volume = 8;
  repeated BufferedRange buffered = 9;
  // While present, keep displaying this track and drive the seek bar from
  // its position_ms (a crossfade is resolving).
  optional FadingState fading = 10;
  optional ExternalPlayback external = 11;
  optional ErrorBody error = 12;
}

// phase is engine truth; intent is what the daemon is trying to do.
// Frontends render optimistic UI from intent, exactly like the built-in
// GUI (pause glyph while loading).
message Intent {
  oneof kind {
    Unit stopped = 1;
    Loading loading = 2;
    Committed committed = 3;
  }
  message Loading {
    uint64 token = 1;
    optional uint64 from_token = 2;
  }
  message Committed {
    uint64 token = 1;
  }
}

message NowPlaying {
  // key is the library ref and the GetArtwork entity id; uid is the
  // source-qualified identity. Same meaning as on TrackInfo.
  string key = 1;
  string uid = 10;
  string title = 2;
  string artist = 3;
  string album = 4;
  optional uint64 duration_ms = 5;
  uint32 khz = 6;
  uint32 bitrate = 7;
  TrackKind kind = 8;
  bool seekable = 9;
}

message PositionAnchor {
  uint64 ms = 1;
  uint64 at_ms = 2;
  bool playing = 3;
}

message BufferedRange {
  uint64 start = 1;
  uint64 end = 2;
  optional uint64 total = 3;
}

message FadingState {
  uint64 from_token = 1;
  NowPlaying track = 2;
  uint64 position_ms = 3;
}

message ExternalPlayback {
  string kind = 1;
  optional string device = 2;
}

message QueueSummary {
  uint64 rev = 1;
  uint32 length = 2;
  optional uint32 index = 3;
  bool shuffle = 4;
  LoopMode loop = 5;
}

// ---------------- queue ----------------

message SetQueueRequest {
  QueueMode mode = 1;
  QueueContext context = 2;
  // replace mode only.
  optional uint32 start_index = 3;
  optional bool shuffle = 4;
}

// Reference-shaped contexts materialize daemon-side, so "play this album"
// never round-trips a track list through the client.
message QueueContext {
  oneof kind {
    TrackKeys tracks = 1;
    Id album = 2;
    Name artist = 3;
    Name genre = 4;
    Id playlist = 5;
    TrackFilter filter = 6;
    Radio radio = 7;
  }
  message TrackKeys {
    repeated string keys = 1;
  }
  message Id {
    string id = 1;
  }
  message Name {
    string name = 1;
  }
  message Radio {
    string station_id = 1;
    string stream_id = 2;
  }
}

// Positions are play-order (logical) indices, the same space
// QueueSummary.index and QueueItem.index use.
message QueueEditRequest {
  oneof op {
    Jump jump = 1;
    Move move = 2;
    Remove remove = 3;
  }
  message Jump {
    uint32 index = 1;
  }
  message Move {
    uint32 from = 1;
    uint32 to = 2;
  }
  message Remove {
    uint32 index = 1;
  }
}

message Page {
  uint32 offset = 1;
  // 0 means the server default (200).
  uint32 limit = 2;
}

message QueueWindow {
  uint64 rev = 1;
  uint32 total = 2;
  uint32 offset = 3;
  repeated QueueItem items = 4;
}

message QueueItem {
  uint32 index = 1;
  TrackInfo track = 2;
}

// ---------------- library ----------------

message TrackFilter {
  optional string search = 1;
  optional string artist = 2;
  optional string album = 3;
  optional string genre = 4;
  optional bool favorite = 5;
  reserved 6; // was a free-form `sort` string
  TrackSort sort = 7;
}

message TracksRequest {
  TrackFilter filter = 1;
  Page page = 2;
}

message FolderRequest {
  string prefix = 1;
  Page page = 2;
}

message TrackPage {
  uint32 total = 1;
  uint32 offset = 2;
  repeated TrackInfo items = 3;
}

message TrackInfo {
  // The stable library ref; use it for queueing, favorites, and artwork.
  string key = 1;
  string uid = 2;
  string title = 3;
  string artist = 4;
  string album = 5;
  string album_id = 6;
  optional uint64 duration_ms = 7;
  uint32 khz = 8;
  uint32 bitrate = 9;
  optional uint32 track_number = 10;
  optional uint32 disc_number = 11;
  TrackKind kind = 12;
  bool seekable = 13;
  bool offline = 14;
}

message TrackRef {
  string key = 1;
}

message Stats {
  map<string, uint64> listen_counts = 1;
}

message Lyrics {
  optional string plain = 1;
  repeated LyricLine synced = 2;
}

message LyricLine {
  uint64 start_ms = 1;
  optional uint64 end_ms = 2;
  string text = 3;
  // Word or syllable timing where the provider has it.
  repeated LyricChunk chunks = 4;
  optional uint32 parent_line_index = 5;
  bool background = 6;
  bool opposite_turn = 7;
}

message LyricChunk {
  uint64 start_ms = 1;
  string text = 2;
}

// ---------------- favorites, jobs, downloads ----------------

message Favorites {
  repeated string refs = 1;
  uint64 generation = 2;
}

message FavoriteRequest {
  string key = 1;
  bool favorite = 2;
}

message StartJobRequest {
  JobKind kind = 1;
}

message JobRef {
  string job_id = 1;
}

message JobId {
  string id = 1;
}

message JobList {
  repeated JobStatus jobs = 1;
}

message JobStatus {
  string id = 1;
  JobKind kind = 2;
  JobState state = 3;
  string phase = 4;
  optional uint64 current = 5;
  optional uint64 total = 6;
  optional string message = 7;
  optional ErrorBody error = 8;
}

message DownloadRequest {
  repeated string keys = 1;
}

message DownloadList {
  repeated string keys = 1;
}

// ---------------- config, status, artwork ----------------

// The settings surface as a real message. Credential keys and machine-local
// path state never leave the daemon; locked_keys are pinned by a managed
// settings layer (a read-only or Nix-store settings.toml, a drop-in, or an
// env override) and render read-only.
message ConfigView {
  Config config = 1;
  repeated string locked_keys = 2;
}

// Replaces the settings surface wholesale: read the view, change what you
// want, send it back. A locked key whose value actually differs is refused.
message SetConfigRequest {
  Config config = 1;
}

// ---------------- config ----------------

// A source is Local, a named local library, or a server; the id carries the
// namespace (`local:<uuid>` or the server id) exactly as AppConfig holds it.
message SourceRef {
  oneof kind {
    Unit local = 1;
    string local_library = 2;
    string server = 3;
  }
}

// proto maps cannot hold a repeated value, so the folder list is wrapped.
message StringList {
  repeated string values = 1;
}

message SavedLocalSource {
  string id = 1;
  string name = 2;
  repeated string directories = 3;
}

message HomeSection {
  string key = 1;
  bool enabled = 2;
}

message RegistryEntry {
  string url = 1;
  bool enabled = 2;
  bool is_default = 3;
}

message CustomTheme {
  string name = 1;
  map<string, string> vars = 2;
}

message YtdlpHistoryEntry {
  string url = 1;
  string title = 2;
  string format = 3;
  string status = 4;
  optional string error = 5;
}

message EqualizerSettings {
  bool enabled = 1;
  EqPreset preset = 2;
  // Exactly ten bands; a different length is rejected at the boundary.
  repeated float bands = 3;
  float preamp_db = 4;
}

message AlbumSortCriterion {
  AlbumSortField field = 1;
  SortDirection direction = 2;
}

message TrackSortCriterion {
  TrackSortField field = 1;
  SortDirection direction = 2;
}

message ArtistSortCriterion {
  ArtistSortField field = 1;
  SortDirection direction = 2;
}

message YtdlpOptions {
  bool embed_metadata = 1;
  bool embed_thumbnail = 2;
  bool postprocess_thumbnail_square = 3;
  bool embed_chapters = 4;
  bool embed_subs = 5;
  bool embed_info_json = 6;
  bool write_thumbnail = 7;
  bool write_description = 8;
  bool write_info_json = 9;
  bool write_subs = 10;
  bool write_auto_subs = 11;
  bool write_comments = 12;
  bool sponsorblock = 13;
  bool sponsorblock_mark = 14;
  bool split_chapters = 15;
  string convert_thumbnail = 16;
  bool no_playlist = 17;
  bool xattrs = 18;
  bool no_mtime = 19;
  string rate_limit = 20;
  string cookies_from_browser = 21;
  string js_runtimes = 22;
  uint32 audio_quality = 23;
}

// The settings surface, mirroring config::AppConfig minus the keys the
// daemon never sends: credentials and machine-local path state.
message Config {
  repeated SavedLocalSource local_sources = 1;
  SourceRef active_source = 2;
  bool source_explicitly_set = 3;
  map<string, StringList> server_folders = 4;
  optional string spotify_browser = 5;
  bool spotify_prefer_active_device = 6;
  repeated string music_directory = 7;
  string theme = 8;
  string live_theme_path = 9;
  string device_id = 10;
  optional bool discord_presence = 11;
  optional bool discord_presence_paused = 12;
  optional bool discord_presence_source = 13;
  SortOrder sort_order = 14;
  repeated AlbumSortCriterion album_sort = 15;
  repeated TrackSortCriterion library_sort = 16;
  repeated AlbumSortCriterion artist_album_sort = 17;
  repeated ArtistSortCriterion artist_sort = 18;
  AlbumViewMode album_view_mode = 19;
  AlbumViewMode artist_album_view_mode = 20;
  AlbumViewMode artists_view_mode = 21;
  ArtistViewOrder artist_view_order = 22;
  map<string, uint64> listen_counts = 23;
  string language = 24;
  bool reduce_animations = 25;
  bool fullscreen_use_player_bar = 26;
  bool fullscreen_tabs_collapsed = 27;
  bool cover_art_background = 28;
  uint32 cover_art_darkening = 29;
  uint32 cover_art_blur = 30;
  string custom_background_path = 31;
  string custom_font_path = 32;
  bool tracing_enabled = 33;
  bool auto_check_updates = 34;
  bool minimize_to_tray = 35;
  bool show_source_toggle = 36;
  bool show_row_images = 37;
  repeated string sidebar_order = 38;
  float volume = 39;
  float volume_scroll_step = 40;
  uint32 crossfade_seconds = 41;
  map<string, CustomTheme> custom_themes = 42;
  BackBehavior back_behavior = 43;
  ChannelMode channel_mode = 44;
  EqualizerSettings equalizer = 45;
  DeviceChangeBehavior device_change_behavior = 46;
  SampleRateMode sample_rate_mode = 47;
  string ytdlp_output_dir = 48;
  YtdlpOptions ytdlp_options = 49;
  repeated YtdlpHistoryEntry ytdlp_history = 50;
  TitlebarMode titlebar_mode = 51;
  OfflineQuality offline_quality = 52;
  PlayerBarPosition player_bar_position = 53;
  UiStyle ui_style = 54;
  SettingsLayout settings_layout = 55;
  uint32 hero_height = 56;
  repeated HomeSection home_sections = 57;
  ListenNowStyle listen_now_style = 58;
  bool auto_fetch_covers = 59;
  FetchStrategy cover_fetch_strategy = 60;
  repeated RegistryEntry radio_registries = 61;
  repeated string pinned_stations = 62;
  bool prefer_local_lyrics = 63;
  bool enable_musixmatch_lyrics = 64;
  int32 lyrics_offset_ms = 65;
  bool lyrics_offset_auto = 66;
  bool lyrics_depth_blur = 67;
  uint32 lyrics_depth_blur_strength = 68;
}

enum AlbumViewMode {
  ALBUM_VIEW_MODE_UNSPECIFIED = 0;
  ALBUM_VIEW_MODE_GRID = 1;
  ALBUM_VIEW_MODE_LIST = 2;
}

enum ArtistViewOrder {
  ARTIST_VIEW_ORDER_UNSPECIFIED = 0;
  ARTIST_VIEW_ORDER_TRACKS = 1;
  ARTIST_VIEW_ORDER_ALBUMS = 2;
}

enum BackBehavior {
  BACK_BEHAVIOR_UNSPECIFIED = 0;
  BACK_BEHAVIOR_REWIND_THEN_PREV = 1;
  BACK_BEHAVIOR_ALWAYS_PREV = 2;
}

enum ChannelMode {
  CHANNEL_MODE_UNSPECIFIED = 0;
  CHANNEL_MODE_STEREO = 1;
  CHANNEL_MODE_MONO = 2;
  CHANNEL_MODE_LEFT_ONLY = 3;
  CHANNEL_MODE_RIGHT_ONLY = 4;
  CHANNEL_MODE_SWAP_LEFT_RIGHT = 5;
}

enum DeviceChangeBehavior {
  DEVICE_CHANGE_BEHAVIOR_UNSPECIFIED = 0;
  DEVICE_CHANGE_BEHAVIOR_RESUME = 1;
  DEVICE_CHANGE_BEHAVIOR_PAUSE = 2;
}

enum FetchStrategy {
  FETCH_STRATEGY_UNSPECIFIED = 0;
  FETCH_STRATEGY_MUSIC_BRAINZ_FIRST = 1;
  FETCH_STRATEGY_LAST_FM_FIRST = 2;
  FETCH_STRATEGY_MUSIC_BRAINZ_ONLY = 3;
  FETCH_STRATEGY_LAST_FM_ONLY = 4;
}

enum ListenNowStyle {
  LISTEN_NOW_STYLE_UNSPECIFIED = 0;
  LISTEN_NOW_STYLE_LIST = 1;
  LISTEN_NOW_STYLE_CARDS = 2;
}

enum OfflineQuality {
  OFFLINE_QUALITY_UNSPECIFIED = 0;
  OFFLINE_QUALITY_KBPS128 = 1;
  OFFLINE_QUALITY_KBPS160 = 2;
  OFFLINE_QUALITY_KBPS192 = 3;
  OFFLINE_QUALITY_KBPS256 = 4;
  OFFLINE_QUALITY_KBPS320 = 5;
  OFFLINE_QUALITY_ORIGINAL = 6;
}

enum PlayerBarPosition {
  PLAYER_BAR_POSITION_UNSPECIFIED = 0;
  PLAYER_BAR_POSITION_BOTTOM = 1;
  PLAYER_BAR_POSITION_TOP = 2;
}

enum SampleRateMode {
  SAMPLE_RATE_MODE_UNSPECIFIED = 0;
  SAMPLE_RATE_MODE_SYSTEM = 1;
  SAMPLE_RATE_MODE_SOURCE = 2;
}

enum SettingsLayout {
  SETTINGS_LAYOUT_UNSPECIFIED = 0;
  SETTINGS_LAYOUT_CD = 1;
  SETTINGS_LAYOUT_TOP_BAR = 2;
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_TITLE = 1;
  SORT_ORDER_ARTIST = 2;
  SORT_ORDER_ALBUM = 3;
}

enum TitlebarMode {
  TITLEBAR_MODE_UNSPECIFIED = 0;
  TITLEBAR_MODE_CUSTOM = 1;
  TITLEBAR_MODE_SYSTEM = 2;
  TITLEBAR_MODE_OFF = 3;
}

enum UiStyle {
  UI_STYLE_UNSPECIFIED = 0;
  UI_STYLE_NORMAL = 1;
  UI_STYLE_VAXRY = 2;
}

enum EqPreset {
  EQ_PRESET_UNSPECIFIED = 0;
  EQ_PRESET_FLAT = 1;
  EQ_PRESET_BASS_BOOST = 2;
  EQ_PRESET_TREBLE_BOOST = 3;
  EQ_PRESET_VOCAL_BOOST = 4;
  EQ_PRESET_LOUDNESS = 5;
  EQ_PRESET_CUSTOM = 6;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}

enum AlbumSortField {
  ALBUM_SORT_FIELD_UNSPECIFIED = 0;
  ALBUM_SORT_FIELD_TITLE = 1;
  ALBUM_SORT_FIELD_ARTIST = 2;
  ALBUM_SORT_FIELD_YEAR = 3;
  ALBUM_SORT_FIELD_GENRE = 4;
}

enum TrackSortField {
  TRACK_SORT_FIELD_UNSPECIFIED = 0;
  TRACK_SORT_FIELD_TITLE = 1;
  TRACK_SORT_FIELD_ARTIST = 2;
  TRACK_SORT_FIELD_ALBUM = 3;
  TRACK_SORT_FIELD_DURATION = 4;
  TRACK_SORT_FIELD_DATE_ADDED = 5;
}

enum ArtistSortField {
  ARTIST_SORT_FIELD_UNSPECIFIED = 0;
  ARTIST_SORT_FIELD_NAME = 1;
  ARTIST_SORT_FIELD_TRACKS = 2;
  ARTIST_SORT_FIELD_ALBUMS = 3;
}

message DaemonStatus {
  string version = 1;
  reserved 2; // was api_version; the frontend ships with the daemon
  uint64 uptime_secs = 3;
}

message ArtworkRequest {
  oneof entity {
    string track = 1;
    string album = 2;
    string artist = 3;
  }
  bool hq = 4;
}

message ArtworkChunk {
  // Set on the first chunk only.
  string content_type = 1;
  bytes data = 2;
}

// ---------------- shared ----------------

// Stable machine-readable error identity; localize by code, never by
// message. The same codes ride tonic Status metadata (kopuz-error-code)
// for RPC-level failures.
message ErrorBody {
  ErrorCode code = 1;
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_INPUT = 1;
  reserved 2; // was ERROR_CODE_UNAUTHORIZED
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_CONFLICT = 4;
  ERROR_CODE_SOURCE_AUTH_EXPIRED = 5;
  ERROR_CODE_SOURCE_UNREACHABLE = 6;
  ERROR_CODE_DAEMON_GONE = 9;
  ERROR_CODE_UNSUPPORTED = 7;
  ERROR_CODE_INTERNAL = 8;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_IDLE = 1;
  PHASE_PLAYING = 2;
  PHASE_PAUSED = 3;
  PHASE_ENDED = 4;
}

enum LoopMode {
  LOOP_MODE_UNSPECIFIED = 0;
  LOOP_MODE_NONE = 1;
  LOOP_MODE_QUEUE = 2;
  LOOP_MODE_TRACK = 3;
}

enum TrackSort {
  // The daemon's own default ordering.
  TRACK_SORT_UNSPECIFIED = 0;
  TRACK_SORT_TITLE = 1;
  TRACK_SORT_ARTIST = 2;
  TRACK_SORT_ALBUM = 3;
  TRACK_SORT_DATE_ADDED = 4;
  TRACK_SORT_PLAY_COUNT = 5;
}

enum TrackKind {
  TRACK_KIND_UNSPECIFIED = 0;
  TRACK_KIND_NORMAL = 1;
  TRACK_KIND_RADIO = 2;
}

enum QueueMode {
  QUEUE_MODE_UNSPECIFIED = 0;
  QUEUE_MODE_REPLACE = 1;
  QUEUE_MODE_APPEND = 2;
  QUEUE_MODE_PLAY_NEXT = 3;
}

enum Table {
  TABLE_UNSPECIFIED = 0;
  TABLE_TRACKS = 1;
  TABLE_ALBUMS = 2;
  TABLE_PLAYLISTS = 3;
  TABLE_FAVORITES = 4;
  TABLE_FOLDERS = 5;
  TABLE_SERVERS = 6;
  TABLE_RECENTS = 7;
}

enum JobKind {
  JOB_KIND_UNSPECIFIED = 0;
  JOB_KIND_SCAN = 1;
  JOB_KIND_LIBRARY_SYNC = 2;
  JOB_KIND_FAVORITES_SYNC = 3;
  JOB_KIND_PLAYLIST_SYNC = 4;
  JOB_KIND_DOWNLOAD = 5;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_RUNNING = 1;
  JOB_STATE_FINISHED = 2;
  JOB_STATE_FAILED = 3;
  JOB_STATE_CANCELLED = 4;
}

enum SourceState {
  SOURCE_STATE_UNSPECIFIED = 0;
  SOURCE_STATE_ONLINE = 1;
  SOURCE_STATE_AUTH_EXPIRED = 2;
  SOURCE_STATE_OFFLINE = 3;
}

enum NoticeLevel {
  NOTICE_LEVEL_UNSPECIFIED = 0;
  NOTICE_LEVEL_INFO = 1;
  NOTICE_LEVEL_WARNING = 2;
  NOTICE_LEVEL_ERROR = 3;
}
