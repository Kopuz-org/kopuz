// The Kopuz daemon wire contract, v1.
//
// One gRPC endpoint on loopback, discovered through the {port, token, pid}
// discovery file. The bearer token travels as metadata
// (authorization: Bearer <token>) and is checked constant-time.
//
// The bidirectional Attach stream is the control plane: the client writes
// transport commands, the server writes acks and every state event. Reads
// and non-transport mutations are unary. A client MUST ignore an Event whose
// oneof it does not know (it decodes as unset) and MUST treat unknown enum
// values as their UNSPECIFIED default.

syntax = "proto3";
package kopuz.v1;

service Kopuz {
  // On connect the client sends Hello first, carrying the last event
  // sequence it saw; the server replays newer events from its ring or
  // emits Resync when the gap is too old, then streams live. Commands are
  // correlated by client-chosen request_id and answered with an Ack whose
  // rev names the state revision containing the command's effect.
  rpc Attach(stream ClientMessage) returns (stream ServerMessage);

  rpc GetStatus(Empty) returns (DaemonStatus);
  rpc GetPlayerState(Empty) returns (PlayerState);
  rpc GetQueue(Page) returns (QueueWindow);
  rpc GetTracks(TracksRequest) returns (TrackPage);
  rpc GetFolderTracks(FolderRequest) returns (TrackPage);
  rpc GetStats(Empty) returns (Stats);
  rpc GetLyrics(TrackRef) returns (Lyrics);
  rpc StreamLyrics(TrackRef) returns (stream Lyrics);
  rpc GetFavorites(Empty) returns (Favorites);
  rpc GetJobs(Empty) returns (JobList);
  rpc GetDownloads(Empty) returns (DownloadList);
  rpc GetDownloadStatuses(Empty) returns (DownloadStatusList);
  rpc GetConfig(Empty) returns (ConfigView);
  rpc GetAlbums(AlbumsRequest) returns (AlbumPage);
  rpc GetAlbum(EntityRef) returns (AlbumInfo);
  rpc GetArtists(Page) returns (ArtistPage);
  rpc RefreshArtistArtwork(StringList) returns (StringList);
  rpc GetGenres(Empty) returns (StringList);
  rpc GetRecentTracks(Page) returns (TrackPage);
  rpc GetAlbumTracks(EntityPage) returns (TrackPage);
  rpc GetArtistTracks(EntityPage) returns (TrackPage);
  rpc GetGenreTracks(EntityPage) returns (TrackPage);
  rpc GetArtistSampleTracks(Page) returns (TrackPage);
  rpc GetTracksByKeys(TrackKeysRequest) returns (TrackList);
  rpc GetTrackWebUrl(TrackRef) returns (OptionalString);
  rpc GetTopGenre(Empty) returns (OptionalString);
  rpc Search(SearchRequest) returns (SearchResults);
  rpc GetPlaylists(Empty) returns (PlaylistCatalog);
  rpc GetPlaylistTracks(PlaylistTracksRequest) returns (TrackPage);
  rpc RefreshPlaylist(PlaylistTracksRequest) returns (TrackPage);
  rpc GetSources(Empty) returns (SourceList);
  rpc ValidateSource(EntityRef) returns (SourceValidation);
  rpc GetExternalAccess(ExternalAccessRequest) returns (ExternalAccess);
  rpc BrowseSource(SourceFolderRequest) returns (SourceFolderList);
  rpc GetIntegrationCredentials(Empty) returns (IntegrationCredentialStatusList);
  rpc GetCatalog(CatalogRequest) returns (CatalogPage);
  rpc GetCatalogDetail(CatalogDetailRequest) returns (CatalogDetail);
  rpc GetRadioStations(Empty) returns (RadioStationList);
  rpc StartTrackRadio(TrackRef) returns (TrackList);
  rpc StartPlaylistRadio(EntityRef) returns (TrackList);
  rpc SearchRadio(RadioSearchRequest) returns (RadioStationList);
  rpc GetRadioRegistries(Empty) returns (RadioRegistryList);

  rpc SetQueue(SetQueueRequest) returns (Ack);
  rpc EditQueue(QueueEditRequest) returns (Ack);
  rpc SetFavorite(FavoriteRequest) returns (Empty);
  rpc StartJob(StartJobRequest) returns (JobRef);
  rpc CancelJob(JobId) returns (Empty);
  rpc StartDownloads(DownloadRequest) returns (JobRef);
  rpc RemoveDownload(TrackRef) returns (Empty);
  rpc CancelDownloadItem(TrackRef) returns (Empty);
  rpc PatchConfig(ConfigPatch) returns (ConfigView);
  rpc CreatePlaylist(CreatePlaylistRequest) returns (EntityRef);
  rpc RenamePlaylist(NamedEntity) returns (Empty);
  rpc DeletePlaylist(EntityRef) returns (Empty);
  rpc AddPlaylistTracks(PlaylistKeysRequest) returns (Empty);
  rpc RemovePlaylistTracks(PlaylistKeysRequest) returns (Empty);
  rpc ReorderPlaylistTracks(PlaylistKeysRequest) returns (Empty);
  rpc CreatePlaylistFolder(Name) returns (EntityRef);
  rpc RenamePlaylistFolder(NamedEntity) returns (Empty);
  rpc DeletePlaylistFolder(EntityRef) returns (Empty);
  rpc MovePlaylist(MovePlaylistRequest) returns (Empty);
  rpc SwitchSource(EntityRef) returns (SourceInfo);
  rpc UpsertServer(ServerDraft) returns (SourceInfo);
  rpc DeleteServer(EntityRef) returns (Empty);
  rpc ProvisionCredentials(CredentialProvision) returns (SourceInfo);
  rpc ClearCredentials(EntityRef) returns (Empty);
  rpc AuthenticateSource(EntityRef) returns (SourceInfo);
  rpc ProvisionIntegrationCredentials(IntegrationCredentialProvision) returns (IntegrationCredentialStatus);
  rpc ClearIntegrationCredentials(IntegrationRef) returns (Empty);
  rpc AuthenticateIntegration(IntegrationCredentialProvision) returns (IntegrationCredentialStatus);
  rpc SetExternalPlayback(SetExternalPlaybackRequest) returns (Empty);
  rpc ClaimExternalPlayback(ExternalPlayback) returns (ExternalPlaybackLease);
  rpc ReportExternalPlayback(ExternalPlaybackReport) returns (Empty);
  rpc ReleaseExternalPlayback(ExternalPlaybackLease) returns (Empty);
  rpc StartYtdlp(YtdlpRequest) returns (JobRef);
  rpc AddRadioRegistry(RegistryRequest) returns (Empty);
  rpc RemoveRadioRegistry(RegistryRequest) returns (Empty);
  rpc SetRadioRegistryEnabled(SetRegistryEnabledRequest) returns (Empty);
  rpc PinRadioStation(PinRadioStationRequest) returns (Empty);
  rpc UpdateTrackMetadata(TrackMetadataPatch) returns (TrackInfo);
  rpc DeleteTracks(DeleteTracksRequest) returns (Empty);
  rpc DeleteAlbum(DeleteAlbumRequest) returns (Empty);
  rpc UploadArtwork(ArtworkUpload) returns (Empty);
  rpc RemoveArtwork(RemoveArtworkRequest) returns (Empty);
  rpc Shutdown(Empty) returns (Empty);

  rpc GetArtwork(ArtworkRequest) returns (stream ArtworkChunk);
}

message Empty {}

message EntityRef {
  string id = 1;
}

message Name {
  string name = 1;
}

message NamedEntity {
  string id = 1;
  string name = 2;
}

message StringList {
  repeated string values = 1;
}

message OptionalString {
  optional string value = 1;
}

message EntityPage {
  string value = 1;
  Page page = 2;
}

// ---------------- control stream ----------------

message ClientMessage {
  oneof msg {
    Hello hello = 1;
    Command command = 2;
  }
}

// First client message on Attach. last_sequence 0 means no resume: the
// client should fetch snapshots itself.
message Hello {
  uint64 last_sequence = 1;
}

message Command {
  uint64 request_id = 1;
  oneof cmd {
    Empty play = 2;
    Empty pause = 3;
    Empty toggle = 4;
    Empty next = 5;
    Empty previous = 6;
    Empty stop = 7;
    Seek seek = 8;
    SetVolume volume = 9;
    SetMode mode = 10;
  }
}

message Seek {
  uint64 position_ms = 1;
}

message SetVolume {
  // 0.0 to 1.0.
  float volume = 1;
}

message SetMode {
  optional bool shuffle = 1;
  optional LoopMode loop = 2;
}

message ServerMessage {
  // Monotonic event sequence; the resume key for Hello.last_sequence.
  // Acks carry the sequence 0: they are per-connection, not replayable.
  uint64 sequence = 1;
  oneof msg {
    Ack ack = 2;
    Event event = 3;
  }
}

message Ack {
  uint64 request_id = 1;
  uint64 rev = 2;
  // A command-level failure (for example a seek on an unseekable track)
  // answers here instead of killing the stream.
  optional ErrorBody error = 3;
}

// ---------------- events ----------------

message Event {
  oneof kind {
    PlayerState player_state = 1;
    PositionEvent position = 2;
    BufferedEvent buffered = 3;
    // A transport command that arrived while playback is external
    // (Spotify in a browser next to a frontend). Only the frontend that
    // owns the external session acts on it; everyone else ignores it.
    Command external_command = 4;
    QueueChanged queue_changed = 5;
    LibraryInvalidated library_invalidated = 6;
    JobProgress job_progress = 7;
    JobFinished job_finished = 8;
    ConfigChanged config_changed = 9;
    SourceStatusEvent source_status = 10;
    Notice notice = 11;
    // The reconnect gap exceeded the replay ring: refetch snapshots.
    Empty resync = 12;
  }
}

message PositionEvent {
  uint64 token = 1;
  uint64 position_ms = 2;
  uint64 at_ms = 3;
  bool playing = 4;
}

message BufferedEvent {
  uint64 token = 1;
  repeated BufferedRange ranges = 2;
}

message QueueChanged {
  uint64 rev = 1;
  uint32 length = 2;
  optional uint32 index = 3;
}

message LibraryInvalidated {
  Table table = 1;
  uint64 generation = 2;
}

message JobProgress {
  string id = 1;
  JobKind kind = 2;
  string phase = 3;
  optional uint64 current = 4;
  optional uint64 total = 5;
  optional string message = 6;
}

message JobFinished {
  string id = 1;
  JobKind kind = 2;
  bool ok = 3;
  optional ErrorBody error = 4;
}

message ConfigChanged {
  repeated string keys = 1;
}

message SourceStatusEvent {
  string source = 1;
  SourceState state = 2;
}

message Notice {
  NoticeLevel level = 1;
  string code = 2;
  optional string message = 3;
}

// ---------------- player state ----------------

message PlayerState {
  uint64 rev = 1;
  // Daemon monotonic clock at send time; pairs with position.at_ms so
  // clients compute one clock offset and interpolate locally. There is no
  // per-second tick stream.
  uint64 now_ms = 2;
  Phase phase = 3;
  Intent intent = 4;
  optional NowPlaying track = 5;
  optional PositionAnchor position = 6;
  QueueSummary queue = 7;
  float volume = 8;
  repeated BufferedRange buffered = 9;
  // While present, keep displaying this track and drive the seek bar from
  // its position_ms (a crossfade is resolving).
  optional FadingState fading = 10;
  optional ExternalPlayback external = 11;
  optional ErrorBody error = 12;
  optional uint64 output_latency_ms = 13;
}

// phase is engine truth; intent is what the daemon is trying to do.
// Frontends render optimistic UI from intent, exactly like the built-in
// GUI (pause glyph while loading).
message Intent {
  oneof kind {
    Empty stopped = 1;
    Loading loading = 2;
    Committed committed = 3;
  }
  message Loading {
    uint64 token = 1;
    optional uint64 from_token = 2;
  }
  message Committed {
    uint64 token = 1;
  }
}

message NowPlaying {
  string key = 1;
  string title = 2;
  string artist = 3;
  string album = 4;
  optional uint64 duration_ms = 5;
  uint32 khz = 6;
  uint32 bitrate = 7;
  TrackKind kind = 8;
  bool seekable = 9;
  // Daemon-relative artwork hint; fetch the bytes via GetArtwork.
  optional string artwork = 10;
}

message PositionAnchor {
  uint64 ms = 1;
  uint64 at_ms = 2;
  bool playing = 3;
}

message BufferedRange {
  uint64 start = 1;
  uint64 end = 2;
  optional uint64 total = 3;
}

message FadingState {
  uint64 from_token = 1;
  NowPlaying track = 2;
  uint64 position_ms = 3;
}

message ExternalPlayback {
  string kind = 1;
  optional string device = 2;
}

message QueueSummary {
  uint64 rev = 1;
  uint32 length = 2;
  optional uint32 index = 3;
  bool shuffle = 4;
  LoopMode loop = 5;
}

// ---------------- queue ----------------

message SetQueueRequest {
  QueueMode mode = 1;
  QueueContext context = 2;
  // replace mode only.
  optional uint32 start_index = 3;
  optional bool shuffle = 4;
  // Insert mode only, in logical play order.
  optional uint32 insert_index = 5;
}

// Reference-shaped contexts materialize daemon-side, so "play this album"
// never round-trips a track list through the client.
message QueueContext {
  oneof kind {
    TrackKeys tracks = 1;
    Id album = 2;
    Name artist = 3;
    Name genre = 4;
    Id playlist = 5;
    TrackFilter filter = 6;
    Radio radio = 7;
    InlineTracks inline_tracks = 8;
  }
  message TrackKeys {
    repeated string keys = 1;
  }
  message Id {
    string id = 1;
  }
  message Name {
    string name = 1;
  }
  message Radio {
    string station_id = 1;
    string stream_id = 2;
  }
  message InlineTracks {
    repeated TrackInfo tracks = 1;
  }
}

// Positions are play-order (logical) indices, the same space
// QueueSummary.index and QueueItem.index use.
message QueueEditRequest {
  oneof op {
    Jump jump = 1;
    Move move = 2;
    Remove remove = 3;
  }
  message Jump {
    uint32 index = 1;
  }
  message Move {
    uint32 from = 1;
    uint32 to = 2;
  }
  message Remove {
    uint32 index = 1;
  }
}

message Page {
  uint32 offset = 1;
  // 0 means the server default (200).
  uint32 limit = 2;
}

message QueueWindow {
  uint64 rev = 1;
  uint32 total = 2;
  uint32 offset = 3;
  repeated QueueItem items = 4;
}

message QueueItem {
  uint32 index = 1;
  TrackInfo track = 2;
}

// ---------------- library ----------------

message TrackFilter {
  optional string search = 1;
  optional string artist = 2;
  optional string album = 3;
  optional string genre = 4;
  optional bool favorite = 5;
  optional string sort = 6;
}

message TracksRequest {
  TrackFilter filter = 1;
  Page page = 2;
}

message FolderRequest {
  string prefix = 1;
  Page page = 2;
}

message TrackPage {
  uint32 total = 1;
  uint32 offset = 2;
  repeated TrackInfo items = 3;
}

message TrackList {
  repeated TrackInfo tracks = 1;
}

message TrackKeysRequest {
  repeated string keys = 1;
}

message TrackInfo {
  // The stable library ref; use it for queueing, favorites, and artwork.
  string key = 1;
  string uid = 2;
  string title = 3;
  string artist = 4;
  string album = 5;
  string album_id = 6;
  optional uint64 duration_ms = 7;
  uint32 khz = 8;
  uint32 bitrate = 9;
  optional uint32 track_number = 10;
  optional uint32 disc_number = 11;
  TrackKind kind = 12;
  bool seekable = 13;
  optional string artwork = 14;
  bool offline = 15;
  optional MusicService service = 16;
  repeated string artists = 17;
  optional string musicbrainz_release_id = 18;
  optional string musicbrainz_recording_id = 19;
  optional string musicbrainz_track_id = 20;
  optional string playlist_item_id = 21;
  string source = 22;
}

message TrackRef {
  string key = 1;
}

message Stats {
  map<string, uint64> listen_counts = 1;
}

message Lyrics {
  optional string plain = 1;
  repeated LyricLine synced = 2;
}

message LyricLine {
  uint64 start_ms = 1;
  optional uint64 end_ms = 2;
  string text = 3;
  // Word or syllable timing where the provider has it.
  repeated LyricChunk chunks = 4;
  optional uint32 parent_line_index = 5;
  bool background = 6;
  bool opposite_turn = 7;
}

message LyricChunk {
  uint64 start_ms = 1;
  string text = 2;
}

// ---------------- frontend library and catalog ----------------

message AlbumFilter {
  optional string search = 1;
  optional string artist = 2;
  optional string genre = 3;
  optional string sort = 4;
}

message AlbumsRequest {
  AlbumFilter filter = 1;
  Page page = 2;
}

message AlbumInfo {
  string id = 1;
  string title = 2;
  string artist = 3;
  string genre = 4;
  uint32 year = 5;
  optional string artwork = 6;
  bool manual_artwork = 7;
}

message AlbumPage {
  uint32 total = 1;
  uint32 offset = 2;
  repeated AlbumInfo items = 3;
}

message ArtistInfo {
  string name = 1;
  uint32 track_count = 2;
  uint32 album_count = 3;
  optional string artwork = 4;
  bool manual_artwork = 5;
}

message ArtistPage {
  uint32 total = 1;
  uint32 offset = 2;
  repeated ArtistInfo items = 3;
}

message SearchRequest {
  string query = 1;
}

message SearchResults {
  repeated TrackInfo tracks = 1;
  repeated AlbumInfo albums = 2;
}

message PlaylistInfo {
  string id = 1;
  string name = 2;
  uint32 track_count = 3;
  optional string artwork = 4;
  repeated string track_keys = 5;
  bool manual_artwork = 6;
}

message PlaylistFolderInfo {
  string id = 1;
  string name = 2;
  repeated string playlist_ids = 3;
}

message PlaylistCatalog {
  repeated PlaylistInfo playlists = 1;
  repeated PlaylistFolderInfo folders = 2;
}

message PlaylistTracksRequest {
  string id = 1;
  Page page = 2;
}

message CreatePlaylistRequest {
  string name = 1;
  repeated string keys = 2;
}

message PlaylistKeysRequest {
  string id = 1;
  repeated string keys = 2;
}

message MovePlaylistRequest {
  string id = 1;
  optional string folder_id = 2;
}

message CatalogRequest {
  optional string continuation = 1;
}

message CatalogItem {
  CatalogItemKind kind = 1;
  string id = 2;
  string title = 3;
  optional string subtitle = 4;
  optional string artwork = 5;
  optional TrackInfo track = 6;
}

message CatalogShelf {
  string title = 1;
  optional string strapline = 2;
  repeated CatalogItem items = 3;
  optional string more_ref = 4;
  bool list = 5;
}

message CatalogPage {
  repeated CatalogShelf shelves = 1;
  optional string continuation = 2;
}

message CatalogDetailRequest {
  CatalogItemKind kind = 1;
  string id = 2;
  optional string continuation = 3;
}

message CatalogDetail {
  CatalogItemKind kind = 1;
  string id = 2;
  string title = 3;
  optional string subtitle = 4;
  optional string description = 5;
  optional string artwork = 6;
  optional string playback_id = 7;
  repeated TrackInfo tracks = 8;
  repeated CatalogShelf shelves = 9;
  optional string continuation = 10;
  optional string year = 11;
}

// ---------------- sources, credentials, and external playback ----------------

message SourceCapabilities {
  bool edit_tags = 1;
  bool delete_from_disk = 2;
  bool scan_folders = 3;
  bool folders = 4;
  bool sync = 5;
  bool downloads = 6;
  bool discover = 7;
  bool track_radio = 8;
  bool playlist_radio = 9;
  PlaylistCapability playlists = 10;
  ArtistPresentation artists = 11;
  AlbumPresentation albums = 12;
}

message SourceInfo {
  string id = 1;
  string name = 2;
  SourceKind kind = 3;
  optional MusicService service = 4;
  bool active = 5;
  bool authenticated = 6;
  SourceCapabilities capabilities = 7;
}

message SourceList {
  repeated SourceInfo sources = 1;
}

message ServerDraft {
  optional string id = 1;
  string name = 2;
  string url = 3;
  MusicService service = 4;
  optional string browser = 5;
  bool anonymous = 6;
  optional string storefront = 7;
  optional string language = 8;
}

message CredentialProvision {
  string server_id = 1;
  string secret = 2;
  optional string user_id = 3;
  optional string browser = 4;
}

message SourceValidation {
  SourceState state = 1;
}

message ExternalAccessRequest {
  string kind = 1;
}

message ExternalAccess {
  string kind = 1;
  string access_token = 2;
  optional string client_id = 3;
}

message SetExternalPlaybackRequest {
  optional ExternalPlayback external = 1;
}

message ExternalPlaybackLease {
  string lease_id = 1;
  uint64 expires_in_ms = 2;
}

message ExternalPlaybackReport {
  string lease_id = 1;
  optional TrackInfo track = 2;
  uint64 position_ms = 3;
  bool playing = 4;
  bool completed = 5;
  optional string device = 6;
}

enum IntegrationKind {
  INTEGRATION_KIND_UNSPECIFIED = 0;
  INTEGRATION_KIND_LISTEN_BRAINZ = 1;
  INTEGRATION_KIND_LAST_FM = 2;
  INTEGRATION_KIND_LIBRE_FM = 3;
}

message IntegrationRef {
  IntegrationKind kind = 1;
}

message IntegrationCredentialStatus {
  IntegrationKind kind = 1;
  bool configured = 2;
}

message IntegrationCredentialStatusList {
  repeated IntegrationCredentialStatus statuses = 1;
}

message IntegrationCredentialProvision {
  IntegrationKind kind = 1;
  optional string token = 2;
  optional string api_key = 3;
  optional string api_secret = 4;
  optional string session_key = 5;
}

message SourceFolderRequest {
  string server_id = 1;
  string path = 2;
}

message SourceFolderEntry {
  string path = 1;
  string name = 2;
}

message SourceFolderList {
  repeated SourceFolderEntry entries = 1;
}

enum YtdlpAudioFormat {
  YTDLP_AUDIO_FORMAT_UNSPECIFIED = 0;
  YTDLP_AUDIO_FORMAT_BEST = 1;
  YTDLP_AUDIO_FORMAT_MP3 = 2;
  YTDLP_AUDIO_FORMAT_M4A = 3;
  YTDLP_AUDIO_FORMAT_OPUS = 4;
  YTDLP_AUDIO_FORMAT_FLAC = 5;
  YTDLP_AUDIO_FORMAT_WAV = 6;
  YTDLP_AUDIO_FORMAT_VIDEO = 7;
}

message YtdlpRequest {
  string url = 1;
  string output_dir = 2;
  YtdlpAudioFormat format = 3;
  string options_json = 4;
}

// ---------------- radio ----------------

message RadioStreamInfo {
  string id = 1;
  string name = 2;
  string url = 3;
}

message RadioStationInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string tags = 4;
  repeated RadioStreamInfo streams = 5;
  bool pinned = 6;
}

message RadioStationList {
  repeated RadioStationInfo stations = 1;
}

message RadioSearchRequest {
  string query = 1;
  uint32 limit = 2;
}

message RadioRegistryInfo {
  string url = 1;
  bool enabled = 2;
  bool built_in = 3;
}

message RadioRegistryList {
  repeated RadioRegistryInfo registries = 1;
}

message RegistryRequest {
  string url = 1;
}

message SetRegistryEnabledRequest {
  string url = 1;
  bool enabled = 2;
}

message PinRadioStationRequest {
  RadioStationInfo station = 1;
  bool pinned = 2;
}

// ---------------- metadata mutations ----------------

message TrackMetadataPatch {
  string key = 1;
  optional string title = 2;
  optional string artist = 3;
  optional string album = 4;
  optional uint32 track_number = 5;
  bool clear_track_number = 6;
  optional uint32 disc_number = 7;
  bool clear_disc_number = 8;
}

message DeleteTracksRequest {
  repeated string keys = 1;
  bool from_disk = 2;
}

message DeleteAlbumRequest {
  string id = 1;
  bool from_disk = 2;
}

message ArtworkUpload {
  oneof target {
    string album_id = 1;
    string artist_name = 2;
    string playlist_id = 3;
    string track_key = 6;
  }
  string content_type = 4;
  bytes data = 5;
}

message RemoveArtworkRequest {
  oneof target {
    string album_id = 1;
    string artist_name = 2;
    string playlist_id = 3;
    string track_key = 4;
  }
}

// ---------------- favorites, jobs, downloads ----------------

message Favorites {
  repeated string refs = 1;
  uint64 generation = 2;
}

message FavoriteRequest {
  string key = 1;
  bool favorite = 2;
}

message StartJobRequest {
  JobKind kind = 1;
}

message JobRef {
  string job_id = 1;
}

message JobId {
  string id = 1;
}

message JobList {
  repeated JobStatus jobs = 1;
}

message JobStatus {
  string id = 1;
  JobKind kind = 2;
  JobState state = 3;
  string phase = 4;
  optional uint64 current = 5;
  optional uint64 total = 6;
  optional string message = 7;
  optional ErrorBody error = 8;
}

message DownloadRequest {
  repeated string keys = 1;
}

message DownloadList {
  repeated string keys = 1;
}

enum DownloadItemState {
  DOWNLOAD_ITEM_STATE_UNSPECIFIED = 0;
  DOWNLOAD_ITEM_STATE_QUEUED = 1;
  DOWNLOAD_ITEM_STATE_DOWNLOADING = 2;
  DOWNLOAD_ITEM_STATE_FINISHED = 3;
  DOWNLOAD_ITEM_STATE_FAILED = 4;
  DOWNLOAD_ITEM_STATE_CANCELLED = 5;
}

message DownloadItemStatus {
  string key = 1;
  DownloadItemState state = 2;
  uint64 bytes_done = 3;
  optional uint64 total_bytes = 4;
  optional string error = 5;
}

message DownloadStatusList {
  repeated DownloadItemStatus statuses = 1;
}

// ---------------- config, status, artwork ----------------

// The config travels as JSON inside the proto: it is an open key space
// the daemon versions independently. Credential keys are stripped from
// views and refused in patches; locked_keys are pinned by a managed
// settings layer and render read-only.
message ConfigView {
  string config_json = 1;
  repeated string locked_keys = 2;
}

// RFC 7396 merge patch, as JSON.
message ConfigPatch {
  string merge_patch_json = 1;
}

message DaemonStatus {
  string version = 1;
  uint32 api_version = 2;
  uint64 uptime_secs = 3;
}

message ArtworkRequest {
  oneof entity {
    string track = 1;
    string album = 2;
    string artist = 3;
    string playlist = 5;
  }
  bool hq = 4;
}

message ArtworkChunk {
  // Set on the first chunk only.
  string content_type = 1;
  bytes data = 2;
}

// ---------------- shared ----------------

// Stable machine-readable error identity; localize by code, never by
// message. The same codes ride tonic Status metadata (kopuz-error-code)
// for RPC-level failures.
message ErrorBody {
  ErrorCode code = 1;
  string message = 2;
