id = "subsonic"
name = "Subsonic"
version = "0.1.0"
api = "0.2"
description = "Subsonic, OpenSubsonic and Navidrome servers, and any server speaking their API."

[permissions]
network = ["$server"]

[[service]]
id = "subsonic"
capabilities = { sync = true, downloads = true, radio = ["track", "playlist"], play-queue = true, ratings = true, artist-info = true, radio-stations = true, playlists = "reorder" }

[[service]]
id = "custom"
capabilities = { sync = true, downloads = true, radio = ["track", "playlist"], play-queue = true, ratings = true, artist-info = true, radio-stations = true, playlists = "reorder" }
