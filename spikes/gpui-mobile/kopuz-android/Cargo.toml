# The real kopuz GPUI app (apps/kopuz/app: its views, theme, components and
# navigation) on gpui-pre-mobile's Android platform, with the kopuz daemon core
# running in this process. It reuses the spike's in-process core and
# surface watcher (../src/{inproc,lifecycle}.rs, included
# by path) and shares the spike workspace's Cargo.lock, which was seeded from
# the root lock so the app's crates keep kopuz's versions.
[package]
name = "kopuz-android"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "kopuz_android"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
kopuz_app = { package = "kopuz", path = "../../../apps/kopuz/app" }
# `theme::mobile`: the phone layout switch and the safe-area insets this host keeps current.
theme = { path = "../../../apps/kopuz/theme" }
gpui = { package = "gpui-pre", version = "=0.3.5", default-features = false }
gpui-mobile = { package = "gpui-pre-mobile", version = "=0.1.0", default-features = false }
api = { package = "kopuz-api", path = "../../../shared/api" }
kopuz_core = { package = "kopuz-daemon", path = "../../../daemon/core" }
db = { package = "kopuz-db", path = "../../../daemon/db" }
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "sync", "macros"] }
log = "0.4.33"
# "log": with no tracing subscriber installed, the app's tracing events become
# log records, which android_logger sends to logcat.
tracing = { version = "0.1", features = ["log"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
rustls-platform-verifier = "0.7"
jni = "0.22"
ndk-context = "0.1"
